<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Peau dégradé volume -->
    <radialGradient id="skinFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="80%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E0B080"/>
    </radialGradient>
    <radialGradient id="skinHand" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <!-- Gilet dégradé -->
    <linearGradient id="vestGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D4A06A"/>
      <stop offset="100%" stop-color="#B8844E"/>
    </linearGradient>
    <!-- Cheveux blancs avec volume -->
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F5F2EE"/>
      <stop offset="100%" stop-color="#D8D4CC"/>
    </radialGradient>
    <!-- Iris -->
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7AA0C4"/>
      <stop offset="60%" stop-color="#4A7A9F"/>
      <stop offset="100%" stop-color="#3A6080"/>
    </radialGradient>
    <!-- Ombre au sol -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond neutre -->
  <rect width="800" height="1200" fill="#E8F0F8"/>

  <!-- Ombre au sol -->
  <ellipse cx="400" cy="1100" rx="160" ry="30" fill="url(#shadowGrad)"/>

  <!-- ═══ PAPY BABOU — style Quelle Histoire ═══ -->
  <g transform="translate(400, 480)">

    <!-- ══ JAMBES ══ -->
    <!-- Pantalon gauche -->
    <path d="M-55,320 Q-60,380 -55,440 Q-50,450 -40,450 Q-30,450 -25,440 Q-20,380 -25,320Z" fill="#3A5E8C" stroke="#2D4A6A" stroke-width="1.5"/>
    <!-- Pantalon droit -->
    <path d="M25,320 Q20,380 25,440 Q30,450 40,450 Q50,450 55,440 Q60,380 55,320Z" fill="#3A5E8C" stroke="#2D4A6A" stroke-width="1.5"/>
    <!-- Chaussures -->
    <ellipse cx="-42" cy="455" rx="32" ry="14" fill="#6B4E2E" stroke="#4A3520" stroke-width="1.5"/>
    <ellipse cx="-42" cy="452" rx="28" ry="10" fill="#8B6A3E"/>
    <ellipse cx="42" cy="455" rx="32" ry="14" fill="#6B4E2E" stroke="#4A3520" stroke-width="1.5"/>
    <ellipse cx="42" cy="452" rx="28" ry="10" fill="#8B6A3E"/>

    <!-- ══ CORPS / GILET ══ -->
    <path d="M-75,160 Q-85,240 -70,330 L70,330 Q85,240 75,160Z" fill="url(#vestGrad)" stroke="#9A7040" stroke-width="1.5"/>
    <!-- Ombre gilet côté gauche -->
    <path d="M-75,160 Q-85,240 -70,330 L-20,330 Q-30,240 -25,160Z" fill="#A07848" opacity="0.3"/>
    <!-- Chemise blanche (col) -->
    <path d="M-35,155 L0,200 L35,155 Q20,140 0,142 Q-20,140 -35,155Z" fill="#F8F4EC" stroke="#D8D0C0" stroke-width="1"/>
    <!-- Boutons -->
    <circle cx="0" cy="230" r="6" fill="#8B6A3E" stroke="#6B4E2E" stroke-width="1"/>
    <circle cx="0" cy="270" r="6" fill="#8B6A3E" stroke="#6B4E2E" stroke-width="1"/>
    <circle cx="0" cy="310" r="6" fill="#8B6A3E" stroke="#6B4E2E" stroke-width="1"/>

    <!-- ══ BRAS GAUCHE (geste conteur, levé) ══ -->
    <path d="M-75,180 Q-130,140 -155,80 Q-160,65 -150,55" fill="none" stroke="#D4A06A" stroke-width="32" stroke-linecap="round"/>
    <!-- Manche -->
    <path d="M-75,180 Q-100,160 -115,140" fill="none" stroke="url(#vestGrad)" stroke-width="36" stroke-linecap="round"/>
    <!-- Main -->
    <circle cx="-150" cy="55" r="22" fill="url(#skinHand)" stroke="#D4A06A" stroke-width="1"/>
    <!-- Index pointé -->
    <path d="M-155,35 Q-152,10 -148,0" fill="none" stroke="url(#skinHand)" stroke-width="12" stroke-linecap="round"/>
    <path d="M-155,35 Q-152,10 -148,0" fill="none" stroke="#E8BC95" stroke-width="10" stroke-linecap="round"/>

    <!-- ══ BRAS DROIT ══ -->
    <path d="M75,180 Q120,200 140,240" fill="none" stroke="#D4A06A" stroke-width="32" stroke-linecap="round"/>
    <path d="M75,180 Q95,190 110,200" fill="none" stroke="url(#vestGrad)" stroke-width="36" stroke-linecap="round"/>
    <circle cx="140" cy="245" r="22" fill="url(#skinHand)" stroke="#D4A06A" stroke-width="1"/>

    <!-- ══ TETE (grosse, ~40% du corps) ══ -->
    <!-- Cou -->
    <rect x="-18" y="130" width="36" height="35" rx="10" fill="url(#skinFace)"/>

    <!-- Tête forme -->
    <ellipse cx="0" cy="0" rx="130" ry="140" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>

    <!-- ══ CHEVEUX BLANCS/GRIS ══ -->
    <!-- Calotte -->
    <path d="M-110,-30 Q-120,-90 -80,-125 Q-40,-155 0,-150 Q40,-155 80,-125 Q120,-90 110,-30"
          fill="url(#hairGrad)" stroke="#C8C0B4" stroke-width="1.5"/>
    <!-- Touffe gauche -->
    <ellipse cx="-115" cy="-20" rx="35" ry="55" fill="url(#hairGrad)" stroke="#C8C0B4" stroke-width="1"/>
    <!-- Touffe droite -->
    <ellipse cx="115" cy="-20" rx="35" ry="55" fill="url(#hairGrad)" stroke="#C8C0B4" stroke-width="1"/>

    <!-- ══ OREILLES ══ -->
    <ellipse cx="-125" cy="15" rx="18" ry="24" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="-125" cy="15" rx="10" ry="16" fill="#F0C0A0" opacity="0.4"/>
    <ellipse cx="125" cy="15" rx="18" ry="24" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="125" cy="15" rx="10" ry="16" fill="#F0C0A0" opacity="0.4"/>

    <!-- ══ YEUX (expressifs, style QH) ══ -->
    <!-- Oeil gauche — blanc -->
    <ellipse cx="-40" cy="5" rx="28" ry="30" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Iris gauche -->
    <circle cx="-35" cy="8" r="18" fill="url(#irisGrad)"/>
    <!-- Pupille gauche -->
    <circle cx="-33" cy="6" r="10" fill="#1A1A2E"/>
    <!-- Reflets gauche -->
    <circle cx="-40" cy="-2" r="7" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-28" cy="10" r="4" fill="#FFFFFF" opacity="0.5"/>
    <!-- Paupière supérieure gauche -->
    <path d="M-68,0 Q-40,-18 -12,-2" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

    <!-- Oeil droit — blanc -->
    <ellipse cx="40" cy="5" rx="28" ry="30" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Iris droit -->
    <circle cx="45" cy="8" r="18" fill="url(#irisGrad)"/>
    <!-- Pupille droit -->
    <circle cx="47" cy="6" r="10" fill="#1A1A2E"/>
    <!-- Reflets droit -->
    <circle cx="40" cy="-2" r="7" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="52" cy="10" r="4" fill="#FFFFFF" opacity="0.5"/>
    <!-- Paupière supérieure droite -->
    <path d="M12,-2 Q40,-18 68,0" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

    <!-- ══ SOURCILS (expressifs, bienveillants) ══ -->
    <path d="M-65,-20 Q-40,-35 -15,-22" fill="none" stroke="#8A8078" stroke-width="6" stroke-linecap="round"/>
    <path d="M15,-22 Q40,-35 65,-20" fill="none" stroke="#8A8078" stroke-width="6" stroke-linecap="round"/>

    <!-- ══ LUNETTES DOREES ══ -->
    <circle cx="-40" cy="5" r="34" fill="none" stroke="#D4A840" stroke-width="5"/>
    <circle cx="40" cy="5" r="34" fill="none" stroke="#D4A840" stroke-width="5"/>
    <!-- Pont -->
    <path d="M-6,5 Q0,-2 6,5" fill="none" stroke="#D4A840" stroke-width="4"/>
    <!-- Branches -->
    <line x1="-74" y1="0" x2="-115" y2="-12" stroke="#D4A840" stroke-width="4" stroke-linecap="round"/>
    <line x1="74" y1="0" x2="115" y2="-12" stroke="#D4A840" stroke-width="4" stroke-linecap="round"/>
    <!-- Reflet lunettes -->
    <path d="M-60,-10 Q-50,-18 -38,-12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <path d="M22,-10 Q32,-18 44,-12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

    <!-- ══ NEZ ══ -->
    <path d="M-5,30 Q0,48 5,30" fill="#E8B88A" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="0" cy="42" rx="10" ry="7" fill="#E8B88A"/>

    <!-- ══ MOUSTACHE ══ -->
    <path d="M-40,55 Q-25,50 -10,55 Q0,62 10,55 Q25,50 40,55 Q35,65 20,62 Q5,72 -5,72 Q-20,62 -35,65Z"
          fill="#C0BBB0" stroke="#A8A098" stroke-width="1"/>

    <!-- ══ BOUCHE (grand sourire chaleureux) ══ -->
    <path d="M-28,72 Q0,95 28,72" fill="#C43A2F" stroke="#2D2D2D" stroke-width="2"/>
    <path d="M-22,74 Q0,82 22,74" fill="#FFFFFF" opacity="0.5"/>

    <!-- ══ JOUES ROSES ══ -->
    <ellipse cx="-70" cy="40" rx="22" ry="16" fill="#F0988C" opacity="0.3"/>
    <ellipse cx="70" cy="40" rx="22" ry="16" fill="#F0988C" opacity="0.3"/>

    <!-- ══ RIDES SOURIRE (subtiles) ══ -->
    <path d="M-75,30 Q-72,50 -68,60" fill="none" stroke="#D4A06A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <path d="M75,30 Q72,50 68,60" fill="none" stroke="#D4A06A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  </g>
</svg>
