<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Peau dégradé volume -->
    <radialGradient id="skinFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="80%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E0B080"/>
    </radialGradient>
    <radialGradient id="skinHand" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <!-- Chemise bleu marine dégradé -->
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2C3E6B"/>
      <stop offset="100%" stop-color="#1A2744"/>
    </linearGradient>
    <!-- Cheveux gris (côtés uniquement) -->
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E8E4DE"/>
      <stop offset="100%" stop-color="#C0B8AC"/>
    </radialGradient>
    <!-- Crâne chauve -->
    <radialGradient id="scalpGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="60%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <!-- Iris -->
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7AA0C4"/>
      <stop offset="60%" stop-color="#4A7A9F"/>
      <stop offset="100%" stop-color="#3A6080"/>
    </radialGradient>
    <!-- Ombre au sol -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond neutre -->
  <rect width="800" height="1200" fill="#E8F0F8"/>

  <!-- Ombre au sol -->
  <ellipse cx="400" cy="1100" rx="160" ry="25" fill="url(#shadowGrad)"/>

  <!-- ═══ PAPY BABOU — style Quelle Histoire ═══ -->
  <g transform="translate(400, 480)">

    <!-- ══ JAMBES ══ -->
    <!-- Pantalon gauche — forme moins arrondie -->
    <path d="M-55,310 L-58,420 Q-55,438 -42,440 Q-28,438 -25,420 L-28,310Z" fill="#4A4A4A" stroke="#333333" stroke-width="1.5"/>
    <!-- Pantalon droit -->
    <path d="M25,310 L22,420 Q25,438 38,440 Q52,438 55,420 L58,310Z" fill="#4A4A4A" stroke="#333333" stroke-width="1.5"/>
    <!-- Chaussures — moins rondes, plus angulaires -->
    <path d="M-70,440 Q-68,455 -42,458 Q-16,455 -14,440 Q-16,432 -42,430 Q-68,432 -70,440Z" fill="#5A3E20" stroke="#3A2510" stroke-width="1.5"/>
    <path d="M-66,437 Q-64,448 -42,450 Q-20,448 -18,437" fill="#7A5E3A" fill-opacity="0.6"/>
    <path d="M14,440 Q16,455 42,458 Q68,455 70,440 Q68,432 42,430 Q16,432 14,440Z" fill="#5A3E20" stroke="#3A2510" stroke-width="1.5"/>
    <path d="M18,437 Q20,448 42,450 Q64,448 66,437" fill="#7A5E3A" fill-opacity="0.6"/>

    <!-- ══ CORPS / CHEMISE BLEU MARINE ══ -->
    <!-- Corps plus trapu/costaud -->
    <path d="M-82,155 Q-92,235 -78,320 L78,320 Q92,235 82,155Z" fill="url(#shirtGrad)" stroke="#152040" stroke-width="1.5"/>
    <!-- Ombre chemise côté gauche -->
    <path d="M-82,155 Q-92,235 -78,320 L-22,320 Q-32,235 -28,155Z" fill="#152040" opacity="0.25"/>
    <!-- Col de chemise -->
    <path d="M-32,152 L-12,175 L0,165 L12,175 L32,152 Q18,140 0,142 Q-18,140 -32,152Z" fill="#344E7A" stroke="#2C3E6B" stroke-width="1"/>
    <!-- Boutons chemise -->
    <circle cx="0" cy="200" r="4" fill="#8A9AB8" stroke="#6A7A98" stroke-width="1"/>
    <circle cx="0" cy="235" r="4" fill="#8A9AB8" stroke="#6A7A98" stroke-width="1"/>
    <circle cx="0" cy="270" r="4" fill="#8A9AB8" stroke="#6A7A98" stroke-width="1"/>

    <!-- ══ BRAS GAUCHE (geste conteur, levé) ══ -->
    <path d="M-82,178 Q-135,135 -158,75 Q-162,58 -152,48" fill="none" stroke="#E0B890" stroke-width="30" stroke-linecap="round"/>
    <!-- Manche chemise -->
    <path d="M-82,178 Q-108,155 -122,135" fill="none" stroke="url(#shirtGrad)" stroke-width="34" stroke-linecap="round"/>
    <!-- Main gauche — forme moins ronde, plus naturaliste -->
    <path d="M-168,42 Q-162,28 -148,30 Q-134,32 -132,46 Q-134,60 -148,62 Q-162,60 -168,46Z" fill="url(#skinHand)" stroke="#D4A06A" stroke-width="1"/>
    <!-- Index pointé -->
    <path d="M-158,30 Q-155,8 -150,-5" fill="none" stroke="#E8BC95" stroke-width="9" stroke-linecap="round"/>
    <path d="M-158,30 Q-155,8 -150,-5" fill="none" stroke="url(#skinHand)" stroke-width="7" stroke-linecap="round"/>

    <!-- ══ BRAS DROIT ══ -->
    <path d="M82,178 Q128,198 148,240" fill="none" stroke="#E0B890" stroke-width="30" stroke-linecap="round"/>
    <path d="M82,178 Q102,188 118,198" fill="none" stroke="url(#shirtGrad)" stroke-width="34" stroke-linecap="round"/>
    <!-- Main droite — moins ronde -->
    <path d="M132,238 Q138,224 150,226 Q162,228 164,242 Q162,256 150,258 Q138,256 132,242Z" fill="url(#skinHand)" stroke="#D4A06A" stroke-width="1"/>
    <!-- Montre au poignet droit -->
    <ellipse cx="135" cy="215" rx="10" ry="12" fill="#3A3A3A" stroke="#2A2A2A" stroke-width="1.5"/>
    <ellipse cx="135" cy="215" rx="7" ry="9" fill="#E8E8E8"/>
    <line x1="135" y1="208" x2="135" y2="215" stroke="#333" stroke-width="1"/>
    <line x1="135" y1="215" x2="139" y2="217" stroke="#333" stroke-width="1"/>

    <!-- ══ TETE (grosse, ~40% du corps, mais MOINS arrondie) ══ -->
    <!-- Cou plus large (costaud) -->
    <rect x="-22" y="125" width="44" height="35" rx="8" fill="url(#skinFace)"/>

    <!-- Tête forme — ellipse plus haute que large, menton plus marqué -->
    <path d="M-115,10 Q-120,-50 -100,-95 Q-70,-135 0,-138 Q70,-135 100,-95 Q120,-50 115,10 Q112,60 90,90 Q60,120 0,125 Q-60,120 -90,90 Q-112,60 -115,10Z"
          fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>

    <!-- ══ CRANE CHAUVE + CHEVEUX SUR LES COTES ══ -->
    <!-- Crâne chauve — sommet lisse avec reflet -->
    <path d="M-95,-30 Q-100,-85 -70,-115 Q-35,-140 0,-138 Q35,-140 70,-115 Q100,-85 95,-30"
          fill="url(#scalpGrad)" stroke="#D4A06A" stroke-width="0.5"/>
    <!-- Reflet sur le crâne -->
    <ellipse cx="-10" cy="-105" rx="35" ry="18" fill="#FFFFFF" opacity="0.15"/>

    <!-- Cheveux gris — SEULEMENT sur les côtés -->
    <!-- Touffe gauche -->
    <path d="M-118,-15 Q-130,-30 -125,-55 Q-118,-75 -105,-70 Q-95,-60 -110,-30 Q-115,-10 -118,-15Z"
          fill="url(#hairGrad)" stroke="#B0A898" stroke-width="1"/>
    <ellipse cx="-112" cy="-5" rx="18" ry="35" fill="url(#hairGrad)" stroke="#B0A898" stroke-width="1"/>
    <!-- Touffe droite -->
    <path d="M118,-15 Q130,-30 125,-55 Q118,-75 105,-70 Q95,-60 110,-30 Q115,-10 118,-15Z"
          fill="url(#hairGrad)" stroke="#B0A898" stroke-width="1"/>
    <ellipse cx="112" cy="-5" rx="18" ry="35" fill="url(#hairGrad)" stroke="#B0A898" stroke-width="1"/>

    <!-- ══ OREILLES ══ -->
    <ellipse cx="-118" cy="15" rx="16" ry="22" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="-118" cy="15" rx="9" ry="14" fill="#F0C0A0" opacity="0.4"/>
    <ellipse cx="118" cy="15" rx="16" ry="22" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="118" cy="15" rx="9" ry="14" fill="#F0C0A0" opacity="0.4"/>

    <!-- ══ YEUX (expressifs, style QH) ══ -->
    <!-- Oeil gauche — blanc -->
    <ellipse cx="-38" cy="8" rx="26" ry="28" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Iris gauche -->
    <circle cx="-33" cy="11" r="16" fill="url(#irisGrad)"/>
    <!-- Pupille gauche -->
    <circle cx="-31" cy="9" r="9" fill="#1A1A2E"/>
    <!-- Reflets gauche -->
    <circle cx="-38" cy="1" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-27" cy="13" r="3.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- Paupière supérieure gauche -->
    <path d="M-64,3 Q-38,-14 -12,1" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

    <!-- Oeil droit — blanc -->
    <ellipse cx="38" cy="8" rx="26" ry="28" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
    <!-- Iris droit -->
    <circle cx="43" cy="11" r="16" fill="url(#irisGrad)"/>
    <!-- Pupille droit -->
    <circle cx="45" cy="9" r="9" fill="#1A1A2E"/>
    <!-- Reflets droit -->
    <circle cx="38" cy="1" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="50" cy="13" r="3.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- Paupière supérieure droite -->
    <path d="M12,1 Q38,-14 64,3" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

    <!-- ══ SOURCILS (expressifs, bienveillants) ══ -->
    <path d="M-62,-16 Q-38,-30 -14,-18" fill="none" stroke="#8A8078" stroke-width="5" stroke-linecap="round"/>
    <path d="M14,-18 Q38,-30 62,-16" fill="none" stroke="#8A8078" stroke-width="5" stroke-linecap="round"/>

    <!-- ══ LUNETTES RECTANGULAIRES FONCÉES ══ -->
    <!-- Verre gauche — rectangle arrondi -->
    <rect x="-68" y="-12" width="60" height="42" rx="8" ry="8" fill="none" stroke="#2A2A2A" stroke-width="5"/>
    <!-- Verre droit -->
    <rect x="8" y="-12" width="60" height="42" rx="8" ry="8" fill="none" stroke="#2A2A2A" stroke-width="5"/>
    <!-- Pont -->
    <path d="M-8,10 Q0,4 8,10" fill="none" stroke="#2A2A2A" stroke-width="4"/>
    <!-- Branches -->
    <line x1="-68" y1="2" x2="-110" y2="-8" stroke="#2A2A2A" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="2" x2="110" y2="-8" stroke="#2A2A2A" stroke-width="4" stroke-linecap="round"/>
    <!-- Reflet lunettes -->
    <path d="M-55,-5 Q-48,-10 -35,-6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <path d="M20,-5 Q28,-10 40,-6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

    <!-- ══ NEZ ══ -->
    <path d="M-4,32 Q0,50 4,32" fill="#E8B88A" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="0" cy="44" rx="9" ry="6" fill="#E8B88A"/>

    <!-- ══ PAS DE MOUSTACHE — bouche directement ══ -->

    <!-- ══ BOUCHE (grand sourire chaleureux) ══ -->
    <path d="M-26,60 Q0,82 26,60" fill="#C43A2F" stroke="#2D2D2D" stroke-width="2"/>
    <path d="M-20,62 Q0,72 20,62" fill="#FFFFFF" opacity="0.5"/>

    <!-- ══ JOUES ROSES ══ -->
    <ellipse cx="-68" cy="42" rx="20" ry="14" fill="#F0988C" opacity="0.3"/>
    <ellipse cx="68" cy="42" rx="20" ry="14" fill="#F0988C" opacity="0.3"/>

    <!-- ══ RIDES SOURIRE (subtiles) ══ -->
    <path d="M-72,32 Q-70,48 -66,58" fill="none" stroke="#D4A06A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <path d="M72,32 Q70,48 66,58" fill="none" stroke="#D4A06A" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>

  </g>
</svg>
