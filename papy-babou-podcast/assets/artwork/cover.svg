<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <!-- Fond principal : gradient bleu nuit cohérent avec le hero du site -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2D4A7A"/>
      <stop offset="55%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#141E35"/>
    </radialGradient>

    <!-- Halo lumineux derrière le titre -->
    <radialGradient id="titleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E8A84C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0"/>
    </radialGradient>

    <!-- Dégradé doré pour "Papy Babou" -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C060"/>
      <stop offset="45%" stop-color="#E8A84C"/>
      <stop offset="100%" stop-color="#B86E20"/>
    </linearGradient>

    <!-- Dégradé doré pour la bordure -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A84C" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#B86E20" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8A84C" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Clip arrondi (border-radius 16px = ~160 en 3000px) -->
    <clipPath id="roundClip">
      <rect width="3000" height="3000" rx="160" ry="160"/>
    </clipPath>
  </defs>

  <!-- ═══ Fond ═══ -->
  <g clip-path="url(#roundClip)">

    <!-- Fond bleu nuit -->
    <rect width="3000" height="3000" fill="url(#bgGlow)"/>

    <!-- ═══ Éléments décoratifs subtils ═══ -->

    <!-- Étoiles discrètes (haut) -->
    <g opacity="0.5">
      <circle cx="350" cy="280" r="4" fill="#FFF8E0"/>
      <circle cx="680" cy="180" r="3" fill="#FFF8E0"/>
      <circle cx="1050" cy="320" r="3.5" fill="#FFF8E0"/>
      <circle cx="1400" cy="150" r="2.5" fill="#FFF8E0"/>
      <circle cx="1750" cy="280" r="4" fill="#FFF8E0"/>
      <circle cx="2100" cy="200" r="3" fill="#FFF8E0"/>
      <circle cx="2400" cy="320" r="3.5" fill="#FFF8E0"/>
      <circle cx="2700" cy="180" r="2.5" fill="#FFF8E0"/>
      <circle cx="500" cy="450" r="2" fill="#FFF8E0"/>
      <circle cx="900" cy="500" r="2.5" fill="#FFF8E0"/>
      <circle cx="2200" cy="480" r="2" fill="#FFF8E0"/>
      <circle cx="2600" cy="420" r="3" fill="#FFF8E0"/>
    </g>

    <!-- Montagnes très subtiles (fond, bas) -->
    <g opacity="0.12">
      <path d="M0,2500 L200,2200 L400,2350 L650,2050 L900,2250 L1100,2100 L1350,1950 L1500,2100 L1700,1900 L1900,2050 L2100,2200 L2350,2000 L2550,2150 L2750,2050 L3000,2250 L3000,3000 L0,3000 Z"
              fill="#2D4A7A"/>
    </g>
    <g opacity="0.08">
      <path d="M0,2600 L300,2350 L500,2450 L750,2200 L1000,2400 L1200,2300 L1500,2150 L1800,2350 L2000,2200 L2250,2350 L2500,2250 L2800,2400 L3000,2300 L3000,3000 L0,3000 Z"
              fill="#1B2A4A"/>
    </g>

    <!-- Étoile de Bethléem (discrète, en haut) -->
    <g transform="translate(1500, 420)" opacity="0.35">
      <polygon points="0,-70 10,-22 60,-22 18,6 30,55 0,25 -30,55 -18,6 -60,-22 -10,-22" fill="#FFF8D0"/>
      <circle cx="0" cy="0" r="14" fill="#FFFBE8" opacity="0.5"/>
    </g>

    <!-- Rose des vents minimaliste (centre, derrière le texte) -->
    <g transform="translate(1500, 1480)" opacity="0.08">
      <!-- Cercle -->
      <circle cx="0" cy="0" r="700" fill="none" stroke="#E8A84C" stroke-width="4"/>
      <circle cx="0" cy="0" r="660" fill="none" stroke="#E8A84C" stroke-width="2"/>
      <!-- 4 pointes principales (très grandes, très discrètes) -->
      <polygon points="0,-640 30,-100 0,-140 -30,-100" fill="#E8A84C"/>
      <polygon points="0,640 30,100 0,140 -30,100" fill="#E8A84C"/>
      <polygon points="-640,0 -100,30 -140,0 -100,-30" fill="#E8A84C"/>
      <polygon points="640,0 100,30 140,0 100,-30" fill="#E8A84C"/>
      <!-- 4 pointes intermédiaires -->
      <polygon points="-440,-440 -60,-60 -80,-80 -60,-60" fill="#E8A84C" opacity="0.6"/>
      <polygon points="440,-440 60,-60 80,-80 60,-60" fill="#E8A84C" opacity="0.6"/>
      <polygon points="-440,440 -60,60 -80,80 -60,60" fill="#E8A84C" opacity="0.6"/>
      <polygon points="440,440 60,60 80,80 60,60" fill="#E8A84C" opacity="0.6"/>
      <!-- Centre -->
      <circle cx="0" cy="0" r="30" fill="#E8A84C"/>
    </g>

    <!-- ═══ Halo derrière le texte ═══ -->
    <ellipse cx="1500" cy="1400" rx="1100" ry="700" fill="url(#titleGlow)"/>

    <!-- ═══ TEXTE PRINCIPAL ═══ -->

    <!-- "Les Histoires de" — plus petit, blanc doux -->
    <text x="1500" y="1180"
          text-anchor="middle"
          font-family="'Baloo 2', 'Nunito', sans-serif"
          font-size="180"
          font-weight="600"
          fill="#FFFFFF"
          opacity="0.85"
          letter-spacing="8">Les Histoires de</text>

    <!-- "Papy" — grand, doré -->
    <text x="1500" y="1480"
          text-anchor="middle"
          font-family="'Baloo 2', 'Nunito', sans-serif"
          font-size="380"
          font-weight="800"
          fill="url(#goldText)"
          letter-spacing="12">Papy</text>

    <!-- "Babou" — grand, doré -->
    <text x="1500" y="1830"
          text-anchor="middle"
          font-family="'Baloo 2', 'Nunito', sans-serif"
          font-size="380"
          font-weight="800"
          fill="url(#goldText)"
          letter-spacing="12">Babou</text>

    <!-- Filet décoratif sous le titre -->
    <g transform="translate(1500, 1920)" opacity="0.45">
      <line x1="-450" y1="0" x2="-60" y2="0" stroke="#E8A84C" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="0" x2="450" y2="0" stroke="#E8A84C" stroke-width="4" stroke-linecap="round"/>
      <!-- Petit losange central -->
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#E8A84C"/>
    </g>

    <!-- Sous-titre — discret -->
    <text x="1500" y="2080"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="100"
          font-weight="600"
          fill="#FFFFFF"
          opacity="0.5"
          letter-spacing="10">Podcast biblique pour enfants</text>

    <!-- ═══ Bordure dorée subtile ═══ -->
    <rect x="60" y="60" width="2880" height="2880" rx="130" ry="130"
          fill="none" stroke="url(#goldBorder)" stroke-width="6"/>

  </g>
</svg>
