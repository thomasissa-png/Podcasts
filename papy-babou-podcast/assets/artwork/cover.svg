<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <!-- Gradient for the bottom banner -->
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="25%" stop-color="#1a1a2e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Rounded clip for the entire canvas -->
    <clipPath id="roundClip">
      <rect width="3000" height="3000" rx="120" ry="120"/>
    </clipPath>

    <!-- Drop shadow filter for text -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle glow for title -->
    <filter id="titleGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#FFD234" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundClip)">

    <!-- ══════ BACKGROUND: Embedded PNG illustration ══════ -->
    <image href="/assets/artwork/cover_base.png"
           x="0" y="0" width="3000" height="3000"
           preserveAspectRatio="xMidYMid slice"/>

    <!-- ══════ BOTTOM BANNER: Semi-transparent dark gradient ══════ -->
    <rect x="0" y="2200" width="3000" height="800" fill="url(#bannerGrad)"/>

    <!-- ══════ TITLE TEXT ══════ -->

    <!-- "Les Histoires de" — smaller line -->
    <text x="1500" y="2580"
          text-anchor="middle"
          font-family="'Baloo 2', 'Fredoka One', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif"
          font-size="140"
          font-weight="700"
          fill="#FFFFFF"
          stroke="#1a1a2e"
          stroke-width="8"
          paint-order="stroke"
          letter-spacing="6"
          filter="url(#textShadow)">Les Histoires de</text>

    <!-- "Papy Babou" — large bold title in warm gold -->
    <text x="1500" y="2780"
          text-anchor="middle"
          font-family="'Baloo 2', 'Fredoka One', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif"
          font-size="300"
          font-weight="800"
          fill="#FFD234"
          stroke="#1a1a2e"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="8"
          filter="url(#titleGlow)">Papy Babou</text>

    <!-- "Podcast biblique pour enfants" — subtitle in white -->
    <text x="1500" y="2900"
          text-anchor="middle"
          font-family="'Baloo 2', 'Fredoka One', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif"
          font-size="80"
          font-weight="600"
          fill="#FFFFFF"
          opacity="0.9"
          letter-spacing="10"
          filter="url(#textShadow)">Podcast biblique pour enfants</text>

    <!-- ══════ ROUNDED BORDER ══════ -->
    <rect x="30" y="30" width="2940" height="2940" rx="110" ry="110"
          fill="none" stroke="#FFD234" stroke-width="10" opacity="0.5"/>
    <rect x="45" y="45" width="2910" height="2910" rx="100" ry="100"
          fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.2"/>

  </g>
</svg>
