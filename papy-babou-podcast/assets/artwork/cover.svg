<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <clipPath id="roundClip">
      <rect width="3000" height="3000" rx="120" ry="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">

    <!-- ══════ FOND IVOIRE ══════ -->
    <rect width="3000" height="3000" fill="#FDF8F0"/>

    <!-- ══════ BORDURE OCRE DORÉ ══════ -->
    <rect x="40" y="40" width="2920" height="2920" rx="100" ry="100"
          fill="none" stroke="#D4A054" stroke-width="12"/>

    <!-- ══════ TEXTE HAUT : "Les Histoires de" ══════ -->
    <text x="1500" y="320"
          text-anchor="middle"
          font-family="'Baloo 2', sans-serif"
          font-size="130"
          font-weight="600"
          fill="#5A6978"
          letter-spacing="6">Les Histoires de</text>

    <!-- ══════ TEXTE TITRE : "Papy Babou" ══════ -->
    <text x="1500" y="540"
          text-anchor="middle"
          font-family="'Baloo 2', sans-serif"
          font-size="340"
          font-weight="800"
          fill="#D4A054"
          letter-spacing="10">Papy</text>
    <text x="1500" y="850"
          text-anchor="middle"
          font-family="'Baloo 2', sans-serif"
          font-size="340"
          font-weight="800"
          fill="#D4A054"
          letter-spacing="10">Babou</text>

    <!-- ══════ ÉTOILES DORÉES (magie de l'histoire) ══════ -->
    <!-- Étoile 4 branches en haut gauche -->
    <g transform="translate(380, 480)">
      <rect x="-4" y="-22" width="8" height="44" rx="4" fill="#E8B84B"/>
      <rect x="-22" y="-4" width="44" height="8" rx="4" fill="#E8B84B"/>
    </g>
    <!-- Étoile en haut droite -->
    <g transform="translate(2620, 380)">
      <rect x="-3" y="-18" width="6" height="36" rx="3" fill="#E8B84B"/>
      <rect x="-18" y="-3" width="36" height="6" rx="3" fill="#E8B84B"/>
    </g>
    <!-- Petites étoiles dispersées -->
    <circle cx="280" cy="700" r="10" fill="#E8B84B"/>
    <circle cx="2720" cy="650" r="8" fill="#E8B84B"/>
    <circle cx="500" cy="350" r="7" fill="#E8B84B" opacity="0.7"/>
    <circle cx="2500" cy="300" r="9" fill="#E8B84B" opacity="0.7"/>
    <circle cx="200" cy="1200" r="8" fill="#E8B84B" opacity="0.5"/>
    <circle cx="2800" cy="1100" r="7" fill="#E8B84B" opacity="0.5"/>
    <!-- Étoiles autour de la scène -->
    <g transform="translate(350, 1350)">
      <rect x="-3" y="-14" width="6" height="28" rx="3" fill="#E8B84B" opacity="0.6"/>
      <rect x="-14" y="-3" width="28" height="6" rx="3" fill="#E8B84B" opacity="0.6"/>
    </g>
    <g transform="translate(2650, 1400)">
      <rect x="-3" y="-14" width="6" height="28" rx="3" fill="#E8B84B" opacity="0.6"/>
      <rect x="-14" y="-3" width="28" height="6" rx="3" fill="#E8B84B" opacity="0.6"/>
    </g>
    <circle cx="550" cy="1700" r="9" fill="#E8B84B" opacity="0.5"/>
    <circle cx="2450" cy="1650" r="8" fill="#E8B84B" opacity="0.5"/>
    <circle cx="700" cy="2100" r="7" fill="#E8B84B" opacity="0.4"/>
    <circle cx="2300" cy="2050" r="8" fill="#E8B84B" opacity="0.4"/>
    <g transform="translate(480, 2300)">
      <rect x="-2.5" y="-12" width="5" height="24" rx="2.5" fill="#E8B84B" opacity="0.5"/>
      <rect x="-12" y="-2.5" width="24" height="5" rx="2.5" fill="#E8B84B" opacity="0.5"/>
    </g>
    <g transform="translate(2520, 2250)">
      <rect x="-2.5" y="-12" width="5" height="24" rx="2.5" fill="#E8B84B" opacity="0.5"/>
      <rect x="-12" y="-2.5" width="24" height="5" rx="2.5" fill="#E8B84B" opacity="0.5"/>
    </g>

    <!-- ══════════════════════════════════════════════ -->
    <!-- ══════ FAUTEUIL (derrière Papy) ══════ -->
    <!-- ══════════════════════════════════════════════ -->
    <!-- Dossier du fauteuil -->
    <path d="M900,1050 Q900,900 1100,860 L1900,860 Q2100,900 2100,1050 L2100,1550 L900,1550 Z"
          fill="#F5E6D0" rx="40"/>
    <!-- Accoudoir gauche -->
    <rect x="820" y="1300" width="140" height="400" rx="50" fill="#D4A054" opacity="0.5"/>
    <!-- Accoudoir droit -->
    <rect x="2040" y="1300" width="140" height="400" rx="50" fill="#D4A054" opacity="0.5"/>
    <!-- Assise du fauteuil -->
    <rect x="880" y="1550" width="1240" height="250" rx="40" fill="#F5E6D0"/>
    <!-- Pieds du fauteuil -->
    <rect x="960" y="1800" width="60" height="100" rx="12" fill="#D4A054" opacity="0.6"/>
    <rect x="1980" y="1800" width="60" height="100" rx="12" fill="#D4A054" opacity="0.6"/>

    <!-- ══════════════════════════════════════════════ -->
    <!-- ══════ PAPY BABOU (centre, assis) ══════ -->
    <!-- ══════════════════════════════════════════════ -->
    <g transform="translate(1500, 1200)">
      <!-- === CORPS === -->
      <!-- Gilet beige -->
      <rect x="-180" y="120" width="360" height="320" rx="50" fill="#F5E6D0"/>
      <!-- Chemise à carreaux (visible au col) -->
      <rect x="-100" y="100" width="200" height="80" rx="20" fill="#7BAFD4" opacity="0.5"/>
      <!-- Carreaux de la chemise -->
      <line x1="-60" y1="110" x2="-60" y2="170" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
      <line x1="-20" y1="110" x2="-20" y2="170" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
      <line x1="20" y1="110" x2="20" y2="170" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>
      <line x1="60" y1="110" x2="60" y2="170" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>

      <!-- Épaules -->
      <ellipse cx="-160" cy="160" rx="80" ry="60" fill="#F5E6D0"/>
      <ellipse cx="160" cy="160" rx="80" ry="60" fill="#F5E6D0"/>

      <!-- === BRAS === -->
      <!-- Bras gauche (tenant le livre) -->
      <path d="M-190,200 Q-280,300 -300,420" fill="none" stroke="#F5E6D0" stroke-width="60" stroke-linecap="round"/>
      <!-- Main gauche -->
      <ellipse cx="-300" cy="440" rx="35" ry="30" fill="#F5E6D0"/>

      <!-- Bras droit (tenant le livre) -->
      <path d="M190,200 Q280,300 300,420" fill="none" stroke="#F5E6D0" stroke-width="60" stroke-linecap="round"/>
      <!-- Main droite -->
      <ellipse cx="300" cy="440" rx="35" ry="30" fill="#F5E6D0"/>

      <!-- === COU === -->
      <rect x="-35" y="60" width="70" height="60" rx="15" fill="#F5E6D0"/>

      <!-- === TÊTE (grande, style chibi) === -->
      <circle cx="0" cy="-40" r="130" fill="#F5E6D0"/>

      <!-- Cheveux blancs (légèrement dégarni, mèches rebelles) -->
      <path d="M-120,-80 Q-130,-160 -90,-180 Q-40,-200 0,-190 Q40,-200 90,-180 Q130,-160 120,-80"
            fill="#FFFFFF"/>
      <!-- Mèches rebelles -->
      <path d="M-60,-185 Q-50,-210 -30,-195" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <path d="M40,-188 Q55,-215 70,-190" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <!-- Zones dégarnies (front visible) -->
      <path d="M-50,-170 Q0,-165 50,-170" fill="#F5E6D0"/>

      <!-- Oreilles -->
      <ellipse cx="-125" cy="-20" rx="22" ry="30" fill="#F5E6D0"/>
      <ellipse cx="125" cy="-20" rx="22" ry="30" fill="#F5E6D0"/>

      <!-- === YEUX (demi-cercles souriants, bleus pétillants) === -->
      <!-- Oeil gauche — demi-cercle (sourire avec les yeux) -->
      <path d="M-55,-45 Q-40,-25 -25,-45" fill="none" stroke="#5A6978" stroke-width="8" stroke-linecap="round"/>
      <!-- Petit reflet bleu -->
      <circle cx="-40" cy="-40" r="5" fill="#7BAFD4"/>
      <!-- Oeil droit — demi-cercle -->
      <path d="M25,-45 Q40,-25 55,-45" fill="none" stroke="#5A6978" stroke-width="8" stroke-linecap="round"/>
      <!-- Petit reflet bleu -->
      <circle cx="40" cy="-40" r="5" fill="#7BAFD4"/>

      <!-- Rides de sourire autour des yeux -->
      <path d="M-62,-40 Q-68,-35 -65,-28" fill="none" stroke="#D4A054" stroke-width="3" opacity="0.4"/>
      <path d="M62,-40 Q68,-35 65,-28" fill="none" stroke="#D4A054" stroke-width="3" opacity="0.4"/>

      <!-- === LUNETTES RONDES (signature visuelle !) === -->
      <circle cx="-40" cy="-35" r="38" fill="none" stroke="#D4A054" stroke-width="8"/>
      <circle cx="40" cy="-35" r="38" fill="none" stroke="#D4A054" stroke-width="8"/>
      <!-- Pont des lunettes -->
      <path d="M-2,-35 Q0,-45 2,-35" fill="none" stroke="#D4A054" stroke-width="6"/>
      <!-- Branches des lunettes -->
      <line x1="-78" y1="-38" x2="-120" y2="-45" stroke="#D4A054" stroke-width="6" stroke-linecap="round"/>
      <line x1="78" y1="-38" x2="120" y2="-45" stroke="#D4A054" stroke-width="6" stroke-linecap="round"/>

      <!-- === NEZ === -->
      <circle cx="0" cy="-10" r="12" fill="#E8B84B" opacity="0.3"/>

      <!-- === MOUSTACHE GRISE === -->
      <path d="M-45,5 Q-30,-8 0,0 Q30,-8 45,5" fill="none" stroke="#5A6978" stroke-width="10" stroke-linecap="round"/>

      <!-- === BOUCHE (sourire chaleureux) === -->
      <path d="M-35,25 Q0,50 35,25" fill="none" stroke="#C47A5A" stroke-width="7" stroke-linecap="round"/>
      <!-- Joues rosées -->
      <circle cx="-70" cy="10" r="18" fill="#D4869A" opacity="0.25"/>
      <circle cx="70" cy="10" r="18" fill="#D4869A" opacity="0.25"/>
    </g>

    <!-- ══════════════════════════════════════════════ -->
    <!-- ══════ LIVRE OUVERT (dans les mains de Papy) ══════ -->
    <!-- ══════════════════════════════════════════════ -->
    <g transform="translate(1500, 1680)">
      <!-- Page gauche -->
      <path d="M-20,-30 L-20,-180 Q-20,-200 -40,-200 L-280,-200 Q-300,-200 -300,-180 L-300,50 Q-300,70 -280,70 L-20,70 Z"
            fill="#FDF8F0"/>
      <!-- Lignes de texte page gauche -->
      <g opacity="0.15">
        <rect x="-270" y="-155" width="160" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-130" width="200" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-105" width="180" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-80" width="190" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-55" width="150" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-30" width="200" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="-5" width="170" height="8" rx="4" fill="#5A6978"/>
        <rect x="-270" y="20" width="190" height="8" rx="4" fill="#5A6978"/>
      </g>

      <!-- Page droite -->
      <path d="M20,-30 L20,-180 Q20,-200 40,-200 L280,-200 Q300,-200 300,-180 L300,50 Q300,70 280,70 L20,70 Z"
            fill="#FDF8F0"/>
      <!-- Lignes de texte page droite -->
      <g opacity="0.15">
        <rect x="50" y="-155" width="190" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-130" width="200" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-105" width="170" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-80" width="200" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-55" width="180" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-30" width="150" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="-5" width="200" height="8" rx="4" fill="#5A6978"/>
        <rect x="50" y="20" width="175" height="8" rx="4" fill="#5A6978"/>
      </g>

      <!-- Reliure du livre (centre, terre cuite) -->
      <rect x="-20" y="-200" width="40" height="270" rx="8" fill="#C47A5A"/>
      <!-- Reflet reliure -->
      <rect x="-8" y="-190" width="6" height="250" rx="3" fill="#D4A054" opacity="0.3"/>

      <!-- Bord du livre -->
      <path d="M-300,-180 L-300,50 Q-300,75 -275,75 L-20,75 L-20,-205 L-275,-205 Q-300,-205 -300,-180 Z"
            fill="none" stroke="#C47A5A" stroke-width="6"/>
      <path d="M300,-180 L300,50 Q300,75 275,75 L20,75 L20,-205 L275,-205 Q300,-205 300,-180 Z"
            fill="none" stroke="#C47A5A" stroke-width="6"/>
    </g>

    <!-- ══════════════════════════════════════════════ -->
    <!-- ══════ ANTOINE (à gauche, 8 ans, assis par terre) ══════ -->
    <!-- ══════════════════════════════════════════════ -->
    <g transform="translate(680, 1750)">
      <!-- === JAMBES croisées === -->
      <ellipse cx="-50" cy="380" rx="80" ry="30" fill="#5A6978"/>
      <ellipse cx="50" cy="380" rx="80" ry="30" fill="#5A6978"/>

      <!-- === CORPS (T-shirt bleu ciel) === -->
      <rect x="-90" y="120" width="180" height="220" rx="40" fill="#7BAFD4"/>

      <!-- === BRAS (penché en avant, captivé) === -->
      <!-- Bras gauche posé au sol -->
      <path d="M-80,200 Q-140,280 -120,340" fill="none" stroke="#7BAFD4" stroke-width="44" stroke-linecap="round"/>
      <ellipse cx="-120" cy="350" rx="25" ry="22" fill="#F5E6D0"/>

      <!-- Bras droit tendu vers le livre -->
      <path d="M80,180 Q160,150 200,120" fill="none" stroke="#7BAFD4" stroke-width="44" stroke-linecap="round"/>
      <ellipse cx="210" cy="110" rx="25" ry="22" fill="#F5E6D0"/>

      <!-- === COU === -->
      <rect x="-22" y="85" width="44" height="45" rx="12" fill="#F5E6D0"/>

      <!-- === TÊTE (grande, chibi) === -->
      <circle cx="0" cy="-15" r="110" fill="#F5E6D0"/>

      <!-- Cheveux bruns ébouriffés -->
      <path d="M-105,-30 Q-110,-120 -80,-145 Q-40,-170 0,-160 Q40,-170 80,-145 Q110,-120 105,-30"
            fill="#8B6914"/>
      <!-- Mèche rebelle sur le front -->
      <path d="M-20,-155 Q-10,-190 15,-165" fill="none" stroke="#8B6914" stroke-width="18" stroke-linecap="round"/>
      <!-- Touffe supplémentaire -->
      <path d="M30,-150 Q50,-180 60,-148" fill="none" stroke="#8B6914" stroke-width="14" stroke-linecap="round"/>

      <!-- Oreilles -->
      <ellipse cx="-105" cy="-5" rx="18" ry="24" fill="#F5E6D0"/>
      <ellipse cx="105" cy="-5" rx="18" ry="24" fill="#F5E6D0"/>

      <!-- === YEUX (ronds, ouverts, excitation) === -->
      <!-- Oeil gauche -->
      <circle cx="-35" cy="-20" r="22" fill="#FFFFFF"/>
      <circle cx="-30" cy="-18" r="14" fill="#5A6978"/>
      <circle cx="-26" cy="-22" r="5" fill="#FFFFFF"/>
      <!-- Oeil droit -->
      <circle cx="35" cy="-20" r="22" fill="#FFFFFF"/>
      <circle cx="40" cy="-18" r="14" fill="#5A6978"/>
      <circle cx="44" cy="-22" r="5" fill="#FFFFFF"/>

      <!-- Sourcils (enthousiastes, relevés) -->
      <path d="M-55,-48 Q-35,-60 -15,-50" fill="none" stroke="#8B6914" stroke-width="7" stroke-linecap="round"/>
      <path d="M15,-50 Q35,-60 55,-48" fill="none" stroke="#8B6914" stroke-width="7" stroke-linecap="round"/>

      <!-- Taches de rousseur -->
      <circle cx="-55" cy="10" r="5" fill="#D4A054" opacity="0.4"/>
      <circle cx="-45" cy="18" r="4" fill="#D4A054" opacity="0.4"/>
      <circle cx="-62" cy="20" r="4" fill="#D4A054" opacity="0.4"/>
      <circle cx="55" cy="10" r="5" fill="#D4A054" opacity="0.4"/>
      <circle cx="45" cy="18" r="4" fill="#D4A054" opacity="0.4"/>
      <circle cx="62" cy="20" r="4" fill="#D4A054" opacity="0.4"/>

      <!-- === NEZ === -->
      <circle cx="0" cy="8" r="8" fill="#E8B84B" opacity="0.25"/>

      <!-- === BOUCHE (ouverte "wow") === -->
      <ellipse cx="0" cy="38" rx="20" ry="16" fill="#C47A5A"/>
      <ellipse cx="0" cy="34" rx="14" ry="6" fill="#FFFFFF"/>

      <!-- Joues rosées -->
      <circle cx="-60" cy="25" r="16" fill="#D4869A" opacity="0.3"/>
      <circle cx="60" cy="25" r="16" fill="#D4869A" opacity="0.3"/>
    </g>

    <!-- ══════════════════════════════════════════════ -->
    <!-- ══════ NOÉMIE (à droite, 5 ans, blottie) ══════ -->
    <!-- ══════════════════════════════════════════════ -->
    <g transform="translate(2320, 1800)">
      <!-- === JAMBES === -->
      <ellipse cx="-40" cy="350" rx="65" ry="25" fill="#D4869A" opacity="0.7"/>
      <ellipse cx="40" cy="350" rx="65" ry="25" fill="#D4869A" opacity="0.7"/>

      <!-- === CORPS (robe rose poudré) === -->
      <rect x="-80" y="120" width="160" height="200" rx="40" fill="#D4869A"/>
      <!-- Petites fleurs sur la robe -->
      <circle cx="-40" cy="170" r="8" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="30" cy="200" r="7" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="-20" cy="250" r="6" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="50" cy="270" r="7" fill="#FFFFFF" opacity="0.5"/>

      <!-- === BRAS === -->
      <!-- Bras gauche (serrant le doudou) -->
      <path d="M-70,180 Q-130,220 -140,280" fill="none" stroke="#D4869A" stroke-width="38" stroke-linecap="round"/>
      <ellipse cx="-140" cy="290" rx="22" ry="18" fill="#F5E6D0"/>

      <!-- Bras droit (aussi vers le doudou) -->
      <path d="M70,180 Q100,260 80,300" fill="none" stroke="#D4869A" stroke-width="38" stroke-linecap="round"/>
      <ellipse cx="78" cy="310" rx="22" ry="18" fill="#F5E6D0"/>

      <!-- === DOUDOU LAPIN === -->
      <g transform="translate(-30, 300)">
        <!-- Corps du lapin -->
        <ellipse cx="0" cy="0" rx="40" ry="35" fill="#FFFFFF"/>
        <!-- Tête du lapin -->
        <circle cx="0" cy="-40" r="25" fill="#FFFFFF"/>
        <!-- Oreilles du lapin -->
        <ellipse cx="-12" cy="-72" rx="8" ry="22" fill="#FFFFFF"/>
        <ellipse cx="12" cy="-72" rx="8" ry="22" fill="#FFFFFF"/>
        <!-- Intérieur oreilles -->
        <ellipse cx="-12" cy="-72" rx="4" ry="14" fill="#D4869A" opacity="0.4"/>
        <ellipse cx="12" cy="-72" rx="4" ry="14" fill="#D4869A" opacity="0.4"/>
        <!-- Yeux du lapin -->
        <circle cx="-8" cy="-42" r="4" fill="#5A6978"/>
        <circle cx="8" cy="-42" r="4" fill="#5A6978"/>
        <!-- Nez du lapin -->
        <circle cx="0" cy="-34" r="3" fill="#D4869A"/>
      </g>

      <!-- === COU === -->
      <rect x="-20" y="85" width="40" height="40" rx="10" fill="#F5E6D0"/>

      <!-- === TÊTE (grande, chibi, petite pour son âge) === -->
      <circle cx="0" cy="-10" r="100" fill="#F5E6D0"/>

      <!-- Cheveux blonds bouclés -->
      <path d="M-95,-25 Q-100,-110 -70,-135 Q-30,-160 0,-150 Q30,-160 70,-135 Q100,-110 95,-25"
            fill="#E8B84B"/>
      <!-- Boucles -->
      <path d="M-90,-30 Q-110,-10 -95,10" fill="none" stroke="#E8B84B" stroke-width="18" stroke-linecap="round"/>
      <path d="M90,-30 Q110,-10 95,10" fill="none" stroke="#E8B84B" stroke-width="18" stroke-linecap="round"/>
      <path d="M-80,-50 Q-100,-35 -88,-15" fill="none" stroke="#E8B84B" stroke-width="14" stroke-linecap="round"/>
      <path d="M80,-50 Q100,-35 88,-15" fill="none" stroke="#E8B84B" stroke-width="14" stroke-linecap="round"/>

      <!-- Ruban rose (barrette fleur) -->
      <circle cx="65" cy="-100" r="16" fill="#D4869A"/>
      <circle cx="65" cy="-100" r="8" fill="#FFFFFF"/>

      <!-- Oreilles -->
      <ellipse cx="-95" cy="0" rx="16" ry="22" fill="#F5E6D0"/>
      <ellipse cx="95" cy="0" rx="16" ry="22" fill="#F5E6D0"/>

      <!-- === YEUX (grands, ronds, émerveillement, bleus comme Papy) === -->
      <!-- Oeil gauche -->
      <circle cx="-30" cy="-15" r="24" fill="#FFFFFF"/>
      <circle cx="-26" cy="-12" r="16" fill="#7BAFD4"/>
      <circle cx="-22" cy="-16" r="6" fill="#FFFFFF"/>
      <!-- Oeil droit -->
      <circle cx="30" cy="-15" r="24" fill="#FFFFFF"/>
      <circle cx="34" cy="-12" r="16" fill="#7BAFD4"/>
      <circle cx="38" cy="-16" r="6" fill="#FFFFFF"/>

      <!-- Sourcils (émerveillés, arrondis) -->
      <path d="M-52,-42 Q-30,-55 -10,-44" fill="none" stroke="#E8B84B" stroke-width="6" stroke-linecap="round"/>
      <path d="M10,-44 Q30,-55 52,-42" fill="none" stroke="#E8B84B" stroke-width="6" stroke-linecap="round"/>

      <!-- === NEZ === -->
      <circle cx="0" cy="10" r="7" fill="#E8B84B" opacity="0.25"/>

      <!-- === BOUCHE (petit sourire chipie) === -->
      <path d="M-18,30 Q-5,42 10,32" fill="none" stroke="#C47A5A" stroke-width="6" stroke-linecap="round"/>

      <!-- Joues rondes et roses -->
      <circle cx="-55" cy="20" r="20" fill="#D4869A" opacity="0.35"/>
      <circle cx="55" cy="20" r="20" fill="#D4869A" opacity="0.35"/>
    </g>

    <!-- ══════ TEXTE BAS : "Podcast biblique pour enfants" ══════ -->
    <text x="1500" y="2750"
          text-anchor="middle"
          font-family="'Baloo 2', sans-serif"
          font-size="90"
          font-weight="500"
          fill="#5A6978"
          letter-spacing="8">Podcast biblique pour enfants</text>

  </g>
</svg>
