<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <!-- Fond chaleureux sable -->
  <rect width="3000" height="3000" fill="#FDF8F0"/>

  <!-- Cercle central ocre dore -->
  <circle cx="1500" cy="1350" r="900" fill="#D4A054" opacity="0.15"/>

  <!-- Cadre decoratif -->
  <rect x="120" y="120" width="2760" height="2760" rx="80" fill="none" stroke="#D4A054" stroke-width="12" opacity="0.4"/>
  <rect x="160" y="160" width="2680" height="2680" rx="60" fill="none" stroke="#D4A054" stroke-width="4" opacity="0.25"/>

  <!-- Etoiles decoratives en haut -->
  <polygon points="500,300 515,350 565,350 525,380 540,430 500,400 460,430 475,380 435,350 485,350" fill="#E8B84B" opacity="0.6"/>
  <polygon points="2500,350 512,392 555,392 520,416 532,460 2500,436 2468,460 2480,416 2445,392 2488,392" fill="#E8B84B" opacity="0.4" transform="translate(1988,350) scale(1) translate(-2500,-350)"/>
  <polygon points="2500,280 2510,310 2540,310 2515,330 2525,360 2500,340 2475,360 2485,330 2460,310 2490,310" fill="#E8B84B" opacity="0.5"/>
  <polygon points="700,450 707,470 728,470 712,484 718,505 700,492 682,505 688,484 672,470 693,470" fill="#E8B84B" opacity="0.35"/>
  <polygon points="2300,480 2307,500 2328,500 2312,514 2318,535 2300,522 2282,535 2288,514 2272,500 2293,500" fill="#E8B84B" opacity="0.3"/>

  <!-- Lunettes de Papy Babou (signature, grande) -->
  <g transform="translate(1500, 750)">
    <!-- Verre gauche -->
    <circle cx="-130" cy="0" r="110" fill="#FDF8F0" fill-opacity="0.5" stroke="#5A6978" stroke-width="18"/>
    <!-- Reflet verre gauche -->
    <ellipse cx="-160" cy="-30" rx="30" ry="20" fill="white" opacity="0.3" transform="rotate(-20, -160, -30)"/>
    <!-- Verre droit -->
    <circle cx="130" cy="0" r="110" fill="#FDF8F0" fill-opacity="0.5" stroke="#5A6978" stroke-width="18"/>
    <!-- Reflet verre droit -->
    <ellipse cx="100" cy="-30" rx="30" ry="20" fill="white" opacity="0.3" transform="rotate(-20, 100, -30)"/>
    <!-- Pont -->
    <path d="M-20,0 Q0,-25 20,0" fill="none" stroke="#5A6978" stroke-width="18" stroke-linecap="round"/>
    <!-- Branches -->
    <line x1="-240" y1="-20" x2="-290" y2="-50" stroke="#5A6978" stroke-width="14" stroke-linecap="round"/>
    <line x1="240" y1="-20" x2="290" y2="-50" stroke="#5A6978" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Livre ouvert (grand, central) -->
  <g transform="translate(1500, 1350)">
    <!-- Ombre du livre -->
    <ellipse cx="0" cy="280" rx="500" ry="40" fill="#D4A054" opacity="0.2"/>

    <!-- Page gauche -->
    <path d="M-30,-250 L-30,200 Q-30,230 -60,230 L-450,230 Q-480,230 -480,200 L-480,-200 Q-480,-230 -450,-230 L-60,-250 Z"
          fill="#FDF8F0" stroke="#5A6978" stroke-width="8"/>
    <!-- Page droite -->
    <path d="M30,-250 L30,200 Q30,230 60,230 L450,230 Q480,230 480,200 L480,-200 Q480,-230 450,-230 L60,-250 Z"
          fill="#FDF8F0" stroke="#5A6978" stroke-width="8"/>
    <!-- Reliure -->
    <path d="M-30,-250 L0,-270 L30,-250 L30,200 L0,240 L-30,200 Z"
          fill="#C47A5A" stroke="#5A6978" stroke-width="6"/>

    <!-- Lignes de texte page gauche -->
    <line x1="-420" y1="-140" x2="-100" y2="-140" stroke="#D4A054" stroke-width="8" stroke-linecap="round"/>
    <line x1="-420" y1="-80" x2="-130" y2="-80" stroke="#D4A054" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="-420" y1="-20" x2="-110" y2="-20" stroke="#D4A054" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
    <line x1="-420" y1="40" x2="-150" y2="40" stroke="#D4A054" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <line x1="-420" y1="100" x2="-120" y2="100" stroke="#D4A054" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

    <!-- Lignes de texte page droite -->
    <line x1="100" y1="-140" x2="420" y2="-140" stroke="#7BAFD4" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="-80" x2="390" y2="-80" stroke="#7BAFD4" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="100" y1="-20" x2="410" y2="-20" stroke="#7BAFD4" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
    <line x1="100" y1="40" x2="370" y2="40" stroke="#7BAFD4" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <line x1="100" y1="100" x2="400" y2="100" stroke="#7BAFD4" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

    <!-- Petite croix decorative sur la page gauche -->
    <g transform="translate(-260, -140)" opacity="0.5">
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#C47A5A" stroke-width="5" stroke-linecap="round"/>
      <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#C47A5A" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Titre principal -->
  <text x="1500" y="2050" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="bold" fill="#5A6978" letter-spacing="3">Les Histoires de</text>
  <text x="1500" y="2250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="bold" fill="#D4A054" letter-spacing="5">Papy Babou</text>

  <!-- Sous-titre -->
  <text x="1500" y="2430" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="#5A6978" opacity="0.7" font-style="italic">Histoires bibliques pour les enfants</text>

  <!-- Petits personnages en bas (silhouettes simples) -->
  <!-- Antoine (garcon) -->
  <g transform="translate(1200, 2650)">
    <circle cx="0" cy="-30" r="22" fill="#7BAFD4"/>
    <path d="M-18,0 Q0,35 18,0" fill="#7BAFD4"/>
  </g>
  <!-- Noemie (fille) -->
  <g transform="translate(1350, 2630)">
    <circle cx="0" cy="-30" r="22" fill="#E88B9C"/>
    <path d="M-18,0 Q0,35 18,0" fill="#E88B9C"/>
    <!-- Noeud cheveux -->
    <circle cx="15" cy="-45" r="8" fill="#E88B9C"/>
  </g>
  <!-- Papy Babou -->
  <g transform="translate(1550, 2600)">
    <circle cx="0" cy="-35" r="28" fill="#D4A054"/>
    <path d="M-22,0 Q0,40 22,0" fill="#D4A054"/>
    <!-- Petites lunettes -->
    <circle cx="-10" cy="-35" r="8" fill="none" stroke="#5A6978" stroke-width="3"/>
    <circle cx="10" cy="-35" r="8" fill="none" stroke="#5A6978" stroke-width="3"/>
    <line x1="-2" y1="-35" x2="2" y2="-35" stroke="#5A6978" stroke-width="3"/>
  </g>

  <!-- Etoiles decoratives en bas -->
  <polygon points="400,2700 407,2720 428,2720 412,2734 418,2755 400,2742 382,2755 388,2734 372,2720 393,2720" fill="#E8B84B" opacity="0.4"/>
  <polygon points="2600,2680 2607,2700 2628,2700 2612,2714 2618,2735 2600,2722 2582,2735 2588,2714 2572,2700 2593,2700" fill="#E8B84B" opacity="0.35"/>
</svg>
