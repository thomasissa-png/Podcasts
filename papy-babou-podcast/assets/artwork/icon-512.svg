<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="i512bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2D4A7A"/>
    </linearGradient>
    <linearGradient id="i512gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A84C"/>
      <stop offset="100%" stop-color="#B86E20"/>
    </linearGradient>
  </defs>

  <!-- Fond carre arrondi -->
  <rect width="512" height="512" rx="96" fill="url(#i512bg)"/>

  <!-- Etoiles subtiles -->
  <circle cx="100" cy="80" r="2" fill="#FFF8E0" opacity="0.5"/>
  <circle cx="420" cy="60" r="1.5" fill="#FFF8E0" opacity="0.4"/>
  <circle cx="60" cy="180" r="1.5" fill="#FFF8E0" opacity="0.3"/>
  <circle cx="450" cy="150" r="2" fill="#FFF8E0" opacity="0.4"/>

  <!-- Anneau dore -->
  <circle cx="256" cy="230" r="180" fill="none" stroke="#B86E20" stroke-width="5" opacity="0.5"/>
  <circle cx="256" cy="230" r="168" fill="none" stroke="#D4883A" stroke-width="2" opacity="0.3"/>

  <!-- Rose des vents -->
  <g transform="translate(256, 230)">
    <!-- 4 principales -->
    <polygon points="0,-160 12,-30 0,-48 -12,-30" fill="#E8A84C"/>
    <polygon points="0,160 12,30 0,48 -12,30" fill="#D4883A"/>
    <polygon points="-160,0 -30,12 -48,0 -30,-12" fill="#D4883A"/>
    <polygon points="160,0 30,12 48,0 30,-12" fill="#D4883A"/>
    <!-- 4 intermediaires -->
    <polygon points="-110,-110 -18,-22 -26,-26 -22,-18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="110,-110 18,-22 26,-26 22,-18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="-110,110 -18,22 -26,26 -22,18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="110,110 18,22 26,26 22,18" fill="#E8A84C" opacity="0.6"/>
    <!-- Lettres cardinales -->
    <text x="0" y="-128" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#8B6914" dominant-baseline="middle">N</text>
    <text x="0" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8B6914" dominant-baseline="middle">S</text>
    <text x="-135" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8B6914" dominant-baseline="middle">O</text>
    <text x="135" y="4" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#8B6914" dominant-baseline="middle">E</text>
    <!-- Centre -->
    <circle cx="0" cy="0" r="16" fill="url(#i512gold)" stroke="#8B6914" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#FDF5E6"/>
  </g>

  <!-- Lunettes signature -->
  <g transform="translate(256, 435)">
    <circle cx="-20" cy="0" r="18" fill="none" stroke="#E8A84C" stroke-width="4.5"/>
    <circle cx="20" cy="0" r="18" fill="none" stroke="#E8A84C" stroke-width="4.5"/>
    <line x1="2" y1="0" x2="-2" y2="0" stroke="#E8A84C" stroke-width="4.5"/>
    <line x1="-38" y1="-5" x2="-48" y2="-12" stroke="#E8A84C" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="38" y1="-5" x2="48" y2="-12" stroke="#E8A84C" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Titre "Papy Babou" -->
  <text x="256" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#E8A84C" letter-spacing="4">PAPY BABOU</text>
</svg>
