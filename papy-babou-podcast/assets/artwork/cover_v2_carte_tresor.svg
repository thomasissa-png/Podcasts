<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <linearGradient id="v2Parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="50%" stop-color="#EEDEB5"/>
      <stop offset="100%" stop-color="#E8D4A0"/>
    </linearGradient>
    <filter id="v2Paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#F5E6C8" surfaceScale="2" result="lit">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="lit" operator="arithmetic" k1="0.5" k2="0.5" k3="0" k4="0"/>
    </filter>
    <clipPath id="v2Clip">
      <rect width="3000" height="3000" rx="140" ry="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v2Clip)">

    <!-- ══════ FOND PARCHEMIN ══════ -->
    <rect width="3000" height="3000" fill="url(#v2Parch)"/>

    <!-- Texture parchemin (taches subtiles) -->
    <g opacity="0.08" fill="#8B6914">
      <circle cx="400" cy="600" r="120"/>
      <circle cx="2500" cy="400" r="80"/>
      <circle cx="1800" cy="2400" r="100"/>
      <circle cx="600" cy="2200" r="90"/>
      <circle cx="1200" cy="800" r="60"/>
      <circle cx="2200" cy="1800" r="70"/>
    </g>

    <!-- Bords brûlés -->
    <g opacity="0.15" fill="#8B6914">
      <path d="M0,0 Q100,50 60,150 Q30,250 80,350 Q50,400 0,380Z"/>
      <path d="M3000,0 Q2900,60 2940,180 Q2970,280 2920,370 Q2950,420 3000,400Z"/>
      <path d="M0,3000 Q80,2950 50,2850 Q20,2750 70,2650 Q40,2600 0,2620Z"/>
      <path d="M3000,3000 Q2920,2940 2950,2830 Q2980,2740 2930,2660 Q2960,2610 3000,2630Z"/>
    </g>

    <!-- ══════ CARTE AU TRESOR — tracés ══════ -->
    <!-- Chemin pointillé principal -->
    <path d="M400,2400 Q600,2200 800,2100 Q1000,2000 1100,1800 Q1200,1600 1500,1500 Q1800,1400 2000,1600 Q2200,1800 2400,1700 Q2600,1600 2700,1500"
          fill="none" stroke="#C4850A" stroke-width="8" stroke-dasharray="30,20" opacity="0.6"/>

    <!-- Points d'intérêt sur la carte -->
    <!-- Pyramide -->
    <g transform="translate(500, 2200)" opacity="0.4">
      <polygon points="0,-60 50,20 -50,20" fill="#C4850A" stroke="#8B6914" stroke-width="4"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#8B6914" stroke-width="3"/>
    </g>
    <!-- Temple -->
    <g transform="translate(1100, 1700)" opacity="0.4">
      <rect x="-30" y="-20" width="60" height="50" fill="none" stroke="#8B6914" stroke-width="4"/>
      <polygon points="-40,-20 0,-50 40,-20" fill="none" stroke="#8B6914" stroke-width="4"/>
      <line x1="-10" y1="-20" x2="-10" y2="30" stroke="#8B6914" stroke-width="3"/>
      <line x1="10" y1="-20" x2="10" y2="30" stroke="#8B6914" stroke-width="3"/>
    </g>
    <!-- Montagne (Sinaï) -->
    <g transform="translate(2000, 1500)" opacity="0.4">
      <polygon points="0,-80 60,20 -60,20" fill="none" stroke="#8B6914" stroke-width="4"/>
      <polygon points="0,-80 15,-50 -15,-50" fill="none" stroke="#8B6914" stroke-width="3"/>
    </g>

    <!-- X marks the spot -->
    <g transform="translate(2650, 1400)">
      <line x1="-40" y1="-40" x2="40" y2="40" stroke="#C4850A" stroke-width="14" stroke-linecap="round"/>
      <line x1="40" y1="-40" x2="-40" y2="40" stroke="#C4850A" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Boussole -->
    <g transform="translate(2400, 2400)">
      <circle cx="0" cy="0" r="100" fill="none" stroke="#C4850A" stroke-width="5" opacity="0.5"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#C4850A" stroke-width="3" opacity="0.3"/>
      <polygon points="0,-80 10,0 -10,0" fill="#C4850A" opacity="0.5"/>
      <polygon points="0,80 10,0 -10,0" fill="#8B6914" opacity="0.3"/>
      <polygon points="-80,0 0,10 0,-10" fill="#8B6914" opacity="0.3"/>
      <polygon points="80,0 0,10 0,-10" fill="#8B6914" opacity="0.3"/>
      <text x="0" y="-62" text-anchor="middle" font-family="serif" font-size="24" font-weight="700" fill="#C4850A" opacity="0.5">N</text>
    </g>

    <!-- Vagues mer -->
    <g opacity="0.2" fill="none" stroke="#4A9FE5" stroke-width="5">
      <path d="M150,2600 Q200,2580 250,2600 Q300,2620 350,2600 Q400,2580 450,2600"/>
      <path d="M100,2650 Q150,2630 200,2650 Q250,2670 300,2650 Q350,2630 400,2650"/>
    </g>

    <!-- ══════ PAPY BABOU (centre, avec longue-vue) ══════ -->
    <g transform="translate(1500, 1900)">
      <!-- Corps -->
      <ellipse cx="0" cy="150" rx="95" ry="85" fill="#D2B48C" stroke="#2D2D2D" stroke-width="7"/>
      <rect x="-30" y="75" width="60" height="35" rx="6" fill="#F0E0C0" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="0" cy="130" r="5" fill="#2D2D2D"/>
      <circle cx="0" cy="155" r="5" fill="#2D2D2D"/>

      <!-- Tête -->
      <circle cx="0" cy="-15" r="115" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <ellipse cx="-90" cy="-48" rx="40" ry="48" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="90" cy="-48" rx="40" ry="48" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M-50,-125 Q0,-148 50,-125" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="-110" cy="-3" rx="15" ry="21" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="110" cy="-3" rx="15" ry="21" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- Yeux + lunettes -->
      <ellipse cx="-35" cy="-16" rx="26" ry="28" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="35" cy="-16" rx="26" ry="28" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-30" cy="-14" r="15" fill="#5A7A9A"/>
      <circle cx="40" cy="-14" r="15" fill="#5A7A9A"/>
      <circle cx="-28" cy="-16" r="8" fill="#2D2D2D"/>
      <circle cx="42" cy="-16" r="8" fill="#2D2D2D"/>
      <circle cx="-35" cy="-24" r="5.5" fill="#FFFFFF"/>
      <circle cx="35" cy="-24" r="5.5" fill="#FFFFFF"/>
      <circle cx="-35" cy="-16" r="30" fill="none" stroke="#E8C44A" stroke-width="8"/>
      <circle cx="35" cy="-16" r="30" fill="none" stroke="#E8C44A" stroke-width="8"/>
      <line x1="-4" y1="-18" x2="4" y2="-18" stroke="#E8C44A" stroke-width="6"/>

      <!-- Sourcils, nez, moustache, sourire -->
      <path d="M-56,-48 Q-35,-58 -14,-50" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      <path d="M14,-50 Q35,-58 56,-48" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="0" cy="8" rx="11" ry="8" fill="#E8B88A" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M-32,21 Q-16,32 0,26 Q16,32 32,21" fill="#C0C0C0" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M-28,38 Q0,58 28,38" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-65" cy="12" r="16" fill="#F26B5E" opacity="0.3"/>
      <circle cx="65" cy="12" r="16" fill="#F26B5E" opacity="0.3"/>

      <!-- Chapeau explorateur -->
      <ellipse cx="0" cy="-115" rx="120" ry="20" fill="#C4850A" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M-70,-115 Q-70,-165 0,-175 Q70,-165 70,-115" fill="#D4A854" stroke="#2D2D2D" stroke-width="6"/>
      <rect x="-15" y="-168" width="30" height="10" rx="4" fill="#E8C44A" stroke="#2D2D2D" stroke-width="3"/>

      <!-- Bras droit avec longue-vue -->
      <path d="M90,120 Q150,80 180,50" fill="none" stroke="#D2B48C" stroke-width="38" stroke-linecap="round"/>
      <circle cx="180" cy="50" r="18" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <!-- Longue-vue -->
      <rect x="175" y="20" width="130" height="25" rx="6" fill="#8B6914" stroke="#2D2D2D" stroke-width="4" transform="rotate(-20, 180, 50)"/>
      <circle cx="295" cy="8" r="18" fill="#4A9FE5" stroke="#8B6914" stroke-width="4" transform="rotate(-20, 180, 50)"/>

      <!-- Bras gauche -->
      <path d="M-90,120 Q-130,140 -140,165" fill="none" stroke="#D2B48C" stroke-width="38" stroke-linecap="round"/>
      <circle cx="-140" cy="165" r="18" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- Jambes -->
      <rect x="-55" y="220" width="42" height="55" rx="16" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="5"/>
      <rect x="13" y="220" width="42" height="55" rx="16" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="-34" cy="280" rx="28" ry="14" fill="#8B6914" stroke="#2D2D2D" stroke-width="4"/>
      <ellipse cx="34" cy="280" rx="28" ry="14" fill="#8B6914" stroke="#2D2D2D" stroke-width="4"/>
    </g>

    <!-- ══════ ANTOINE (gauche, carte en main) ══════ -->
    <g transform="translate(600, 2050) scale(0.75)">
      <ellipse cx="0" cy="130" rx="70" ry="65" fill="#4A9FE5" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-10" r="95" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-80,-32 Q-85,-90 -52,-102 Q-22,-118 0,-112 Q22,-118 52,-102 Q85,-88 80,-32" fill="#8B6914" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="-26" cy="-6" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="26" cy="-6" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-21" cy="-4" r="13" fill="#2D5B9E"/>
      <circle cx="31" cy="-4" r="13" fill="#2D5B9E"/>
      <circle cx="-19" cy="-6" r="7" fill="#2D2D2D"/>
      <circle cx="33" cy="-6" r="7" fill="#2D2D2D"/>
      <circle cx="-26" cy="-14" r="5" fill="#FFFFFF"/>
      <circle cx="26" cy="-14" r="5" fill="#FFFFFF"/>
      <path d="M-22,30 Q0,48 22,30" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-50" cy="16" r="13" fill="#F26B5E" opacity="0.35"/>
      <circle cx="50" cy="16" r="13" fill="#F26B5E" opacity="0.35"/>
      <!-- Loupe -->
      <path d="M85,90 Q120,55 135,30" fill="none" stroke="#4A9FE5" stroke-width="28" stroke-linecap="round"/>
      <circle cx="135" cy="30" r="14" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
      <circle cx="165" cy="-5" r="28" fill="none" stroke="#8B6914" stroke-width="6"/>
      <line x1="145" y1="15" x2="155" y2="5" stroke="#8B6914" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- ══════ NOEMIE (droite) ══════ -->
    <g transform="translate(2400, 2080) scale(0.75)">
      <ellipse cx="0" cy="120" rx="65" ry="60" fill="#E895A8" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-15" r="85" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-72,-28 Q-76,-82 -46,-95 Q-20,-110 0,-104 Q20,-110 46,-95 Q76,-80 72,-28" fill="#FFD234" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-72" cy="-46" r="16" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="72" cy="-46" r="16" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <path d="M8,-98 Q18,-112 28,-98" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M8,-98 Q18,-84 28,-98" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <circle cx="18" cy="-98" r="5" fill="#D4486B" stroke="#2D2D2D" stroke-width="3"/>
      <ellipse cx="-23" cy="-8" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="23" cy="-8" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-27" cy="-6" r="12" fill="#4A9FE5"/>
      <circle cx="19" cy="-6" r="12" fill="#4A9FE5"/>
      <circle cx="-28" cy="-8" r="6.5" fill="#2D2D2D"/>
      <circle cx="18" cy="-8" r="6.5" fill="#2D2D2D"/>
      <circle cx="-23" cy="-16" r="4.5" fill="#FFFFFF"/>
      <circle cx="23" cy="-16" r="4.5" fill="#FFFFFF"/>
      <path d="M-20,24 Q0,40 20,24" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-46" cy="14" r="13" fill="#F26B5E" opacity="0.4"/>
      <circle cx="46" cy="14" r="13" fill="#F26B5E" opacity="0.4"/>
      <!-- Doudou lapin -->
      <g transform="translate(-85, 100)">
        <ellipse cx="0" cy="14" rx="16" ry="20" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"/>
        <circle cx="0" cy="-6" r="13" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="4"/>
        <ellipse cx="-7" cy="-22" rx="5" ry="13" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="3"/>
        <ellipse cx="7" cy="-22" rx="5" ry="13" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="3"/>
        <circle cx="-4" cy="-8" r="3" fill="#2D2D2D"/>
        <circle cx="4" cy="-8" r="3" fill="#2D2D2D"/>
        <ellipse cx="0" cy="-3" rx="3" ry="2" fill="#F0B0C0"/>
      </g>
    </g>

    <!-- ══════ TEXTE ══════ -->
    <text x="1500" y="380"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="130"
          font-weight="700"
          fill="#8B6914"
          stroke="#F5E6C8"
          stroke-width="6"
          paint-order="stroke"
          letter-spacing="4">Les Histoires de</text>

    <text x="1500" y="650"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="400"
          font-weight="800"
          fill="#C4850A"
          stroke="#8B6914"
          stroke-width="12"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(-3, 1500, 650)">Papy</text>

    <text x="1500" y="1020"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="400"
          font-weight="800"
          fill="#F26B5E"
          stroke="#8B6914"
          stroke-width="12"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(2, 1500, 1020)">Babou</text>

    <text x="1500" y="1200"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="70"
          font-weight="600"
          fill="#8B6914"
          letter-spacing="6"
          opacity="0.7">Podcast biblique pour enfants</text>

    <!-- ══════ BORDURE ══════ -->
    <rect x="35" y="35" width="2930" height="2930" rx="130" ry="130"
          fill="none" stroke="#C4850A" stroke-width="10" opacity="0.4"/>
    <rect x="50" y="50" width="2900" height="2900" rx="125" ry="125"
          fill="none" stroke="#C4850A" stroke-width="4" opacity="0.2" stroke-dasharray="20,15"/>

  </g>
</svg>
