<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <linearGradient id="v4Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B0A3A"/>
      <stop offset="25%" stop-color="#4A1A6B"/>
      <stop offset="50%" stop-color="#E85A3A"/>
      <stop offset="70%" stop-color="#F5A020"/>
      <stop offset="85%" stop-color="#FFD234"/>
      <stop offset="100%" stop-color="#FFE88A"/>
    </linearGradient>
    <radialGradient id="v4Sun" cx="50%" cy="62%" r="25%">
      <stop offset="0%" stop-color="#FFE88A" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFD234" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5A020" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="v4Clip">
      <rect width="3000" height="3000" rx="140" ry="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v4Clip)">

    <!-- ══════ CIEL COUCHER DE SOLEIL ══════ -->
    <rect width="3000" height="3000" fill="url(#v4Sky)"/>

    <!-- Soleil -->
    <circle cx="1500" cy="1900" r="250" fill="#FFE88A" opacity="0.9"/>
    <rect width="3000" height="3000" fill="url(#v4Sun)"/>

    <!-- Nuages silhouette -->
    <g fill="#1B0A3A" opacity="0.15">
      <ellipse cx="400" cy="600" rx="250" ry="80"/>
      <ellipse cx="280" cy="580" rx="180" ry="70"/>
      <ellipse cx="550" cy="590" rx="150" ry="60"/>
      <ellipse cx="2400" cy="500" rx="300" ry="90"/>
      <ellipse cx="2250" cy="480" rx="200" ry="70"/>
      <ellipse cx="2580" cy="490" rx="180" ry="65"/>
    </g>

    <!-- Étoiles du soir (haut) -->
    <g fill="#FFFFFF">
      <circle cx="300" cy="200" r="3" opacity="0.7"/>
      <circle cx="700" cy="150" r="2.5" opacity="0.5"/>
      <circle cx="1100" cy="120" r="2" opacity="0.4"/>
      <circle cx="1900" cy="180" r="3" opacity="0.6"/>
      <circle cx="2300" cy="100" r="2" opacity="0.4"/>
      <circle cx="2700" cy="220" r="2.5" opacity="0.5"/>
      <circle cx="500" cy="350" r="2" opacity="0.3"/>
      <circle cx="2500" cy="300" r="2" opacity="0.3"/>
    </g>

    <!-- ══════ PAYSAGE BIBLIQUE (silhouettes) ══════ -->
    <!-- Collines lointaines -->
    <path d="M0,2050 Q300,1900 600,1950 Q900,1850 1200,1920 Q1500,1830 1800,1900 Q2100,1840 2400,1910 Q2700,1860 3000,1980 L3000,3000 L0,3000Z"
          fill="#2D0A2A" opacity="0.5"/>

    <!-- Palmiers et temple silhouette -->
    <g fill="#1B0A3A" opacity="0.6">
      <!-- Palmier gauche -->
      <rect x="350" y="1850" width="25" height="250" rx="4"/>
      <path d="M362,1850 Q320,1800 270,1790 Q310,1820 362,1850Z"/>
      <path d="M362,1850 Q380,1790 420,1770 Q400,1810 362,1850Z"/>
      <path d="M362,1850 Q340,1780 310,1760 Q330,1800 362,1850Z"/>
      <path d="M362,1850 Q400,1800 450,1800 Q420,1830 362,1850Z"/>

      <!-- Temple -->
      <rect x="2100" y="1900" width="180" height="200" rx="5"/>
      <polygon points="2100,1900 2190,1820 2280,1900"/>
      <rect x="2130" y="1920" width="20" height="180"/>
      <rect x="2230" y="1920" width="20" height="180"/>
      <rect x="2160" y="2020" width="40" height="80" rx="12"/>

      <!-- Palmier droite -->
      <rect x="2650" y="1870" width="22" height="230" rx="4"/>
      <path d="M2661,1870 Q2620,1820 2580,1810 Q2610,1840 2661,1870Z"/>
      <path d="M2661,1870 Q2700,1810 2740,1800 Q2710,1840 2661,1870Z"/>
      <path d="M2661,1870 Q2640,1800 2610,1780 Q2630,1820 2661,1870Z"/>
    </g>

    <!-- Sol premier plan -->
    <path d="M0,2200 Q500,2150 1000,2180 Q1500,2120 2000,2160 Q2500,2100 3000,2180 L3000,3000 L0,3000Z"
          fill="#2D0A2A" opacity="0.7"/>
    <path d="M0,2300 Q400,2260 800,2280 Q1200,2240 1600,2270 Q2000,2230 2400,2260 Q2800,2220 3000,2280 L3000,3000 L0,3000Z"
          fill="#1B0A2A"/>

    <!-- ══════ SILHOUETTES DES PERSONNAGES ══════ -->
    <g transform="translate(1500, 2050)">

      <!-- Papy Babou (centre) — silhouette dorée -->
      <g fill="#FFD234" opacity="0.95">
        <!-- Corps -->
        <ellipse cx="0" cy="120" rx="80" ry="70"/>
        <!-- Tête -->
        <circle cx="0" cy="-20" r="95"/>
        <!-- Cheveux -->
        <ellipse cx="-75" cy="-50" rx="35" ry="40"/>
        <ellipse cx="75" cy="-50" rx="35" ry="40"/>
        <!-- Lunettes (silhouette) -->
        <circle cx="-30" cy="-20" r="28" fill="#1B0A3A" opacity="0.3"/>
        <circle cx="30" cy="-20" r="28" fill="#1B0A3A" opacity="0.3"/>
        <circle cx="-30" cy="-20" r="22"/>
        <circle cx="30" cy="-20" r="22"/>
        <!-- Bras levé gauche (pointe vers le ciel) -->
        <path d="M-80,90 Q-140,40 -160,-20 Q-170,-50 -155,-60" fill="none" stroke="#FFD234" stroke-width="35" stroke-linecap="round"/>
        <circle cx="-155" cy="-60" r="18"/>
        <rect x="-160" y="-100" width="10" height="35" rx="5"/>
        <!-- Bras droit -->
        <path d="M80,90 Q130,100 145,120" fill="none" stroke="#FFD234" stroke-width="35" stroke-linecap="round"/>
        <circle cx="145" cy="120" r="18"/>
        <!-- Jambes -->
        <rect x="-45" y="175" width="35" height="50" rx="14"/>
        <rect x="10" y="175" width="35" height="50" rx="14"/>
      </g>

      <!-- Antoine (gauche) — silhouette dorée plus petit -->
      <g fill="#FFD234" opacity="0.85" transform="translate(-350, 50) scale(0.75)">
        <ellipse cx="0" cy="110" rx="65" ry="60"/>
        <circle cx="0" cy="-10" r="82"/>
        <path d="M-70,-25 Q-75,-80 -45,-92 Q-18,-105 0,-100 Q18,-105 45,-92 Q75,-77 70,-25" />
        <path d="M3,-100 Q8,-130 16,-126 Q12,-115 10,-100"/>
        <!-- Bras tendu -->
        <path d="M60,85 Q100,55 125,25" fill="none" stroke="#FFD234" stroke-width="28" stroke-linecap="round"/>
        <circle cx="125" cy="25" r="15"/>
        <rect x="-40" y="160" width="30" height="45" rx="12"/>
        <rect x="10" y="160" width="30" height="45" rx="12"/>
      </g>

      <!-- Noémie (droite) — silhouette dorée plus petite -->
      <g fill="#FFD234" opacity="0.85" transform="translate(350, 60) scale(0.7)">
        <ellipse cx="0" cy="100" rx="60" ry="55"/>
        <circle cx="0" cy="-15" r="75"/>
        <path d="M-62,-22 Q-66,-72 -38,-82 Q-16,-94 0,-88 Q16,-94 38,-82 Q66,-68 62,-22"/>
        <circle cx="-62" cy="-40" r="15"/>
        <circle cx="62" cy="-40" r="15"/>
        <!-- Noeud -->
        <path d="M8,-85 Q16,-100 24,-85" />
        <path d="M8,-85 Q16,-70 24,-85" />
        <!-- Bras levé -->
        <path d="M55,75 Q90,40 100,10" fill="none" stroke="#FFD234" stroke-width="24" stroke-linecap="round"/>
        <circle cx="100" cy="10" r="13"/>
        <!-- Doudou -->
        <g transform="translate(-75, 80)">
          <ellipse cx="0" cy="10" rx="14" ry="18"/>
          <circle cx="0" cy="-6" r="12"/>
          <ellipse cx="-6" cy="-18" rx="4" ry="11"/>
          <ellipse cx="6" cy="-18" rx="4" ry="11"/>
        </g>
        <rect x="-35" y="145" width="26" height="40" rx="10"/>
        <rect x="10" y="145" width="26" height="40" rx="10"/>
      </g>
    </g>

    <!-- ══════ TEXTE ══════ -->
    <text x="1500" y="400"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="140"
          font-weight="700"
          fill="#FFFFFF"
          stroke="#1B0A3A"
          stroke-width="8"
          paint-order="stroke"
          letter-spacing="5"
          opacity="0.95">Les Histoires de</text>

    <text x="1500" y="700"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="400"
          font-weight="800"
          fill="#FFD234"
          stroke="#1B0A3A"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(-2, 1500, 700)">Papy</text>

    <text x="1500" y="1060"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="400"
          font-weight="800"
          fill="#F26B5E"
          stroke="#1B0A3A"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(2, 1500, 1060)">Babou</text>

    <!-- Sous-titre -->
    <text x="1500" y="2850"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="70"
          font-weight="600"
          fill="#FFE88A"
          stroke="#1B0A3A"
          stroke-width="5"
          paint-order="stroke"
          letter-spacing="6">Les épopées bibliques en famille</text>

    <!-- ══════ BORDURE ══════ -->
    <rect x="40" y="40" width="2920" height="2920" rx="130" ry="130"
          fill="none" stroke="#FFD234" stroke-width="10" opacity="0.4"/>

  </g>
</svg>
