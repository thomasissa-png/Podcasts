<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <clipPath id="c2"><rect width="3000" height="3000" rx="100" ry="100"/></clipPath>
  </defs>
  <g clip-path="url(#c2)">

    <!-- Fond bleu nuit profond -->
    <rect width="3000" height="3000" fill="#1E2D4A"/>

    <!-- Étoiles (petits points) -->
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="150" cy="200" r="2.5"/><circle cx="400" cy="120" r="2"/>
      <circle cx="650" cy="280" r="3"/><circle cx="900" cy="150" r="2"/>
      <circle cx="1150" cy="250" r="2.5"/><circle cx="1350" cy="100" r="2"/>
      <circle cx="1650" cy="220" r="3"/><circle cx="1900" cy="130" r="2"/>
      <circle cx="2150" cy="280" r="2.5"/><circle cx="2400" cy="160" r="2"/>
      <circle cx="2650" cy="240" r="3"/><circle cx="2850" cy="120" r="2"/>
      <circle cx="300" cy="400" r="2"/><circle cx="800" cy="450" r="2.5"/>
      <circle cx="1300" cy="380" r="2"/><circle cx="2000" cy="420" r="2"/>
      <circle cx="2500" cy="350" r="2.5"/><circle cx="2750" cy="430" r="2"/>
    </g>
    <!-- Étoile brillante -->
    <g fill="#F0C850" opacity="0.7">
      <polygon points="1500,80 1506,100 1528,100 1510,112 1518,135 1500,122 1482,135 1490,112 1472,100 1494,100"/>
    </g>

    <!-- Lune (croissant simple) -->
    <g transform="translate(2500, 350)">
      <circle cx="0" cy="0" r="80" fill="#F0E8C0"/>
      <circle cx="30" cy="-20" r="70" fill="#1E2D4A"/>
    </g>

    <!-- Dunes de sable (nuit) -->
    <ellipse cx="600" cy="2600" rx="1000" ry="300" fill="#C4A86C" opacity="0.6"/>
    <ellipse cx="2000" cy="2650" rx="1200" ry="280" fill="#B89A5A" opacity="0.5"/>
    <rect x="0" y="2550" width="3000" height="450" fill="#A88C4A" opacity="0.7"/>

    <!-- Tente de Papy (arrière-plan) -->
    <g transform="translate(1500, 2200)">
      <polygon points="0,-250 250,50 -250,50" fill="#C49A6C" opacity="0.6"/>
      <polygon points="0,-250 30,50 -30,50" fill="#D4AA7C" opacity="0.5"/>
      <!-- Ouverture -->
      <path d="M-30,50 Q0,0 30,50" fill="#8B6A3E" opacity="0.4"/>
    </g>

    <!-- Feu de camp -->
    <g transform="translate(1500, 2480)">
      <!-- Bûches -->
      <rect x="-40" y="0" width="80" height="12" rx="6" fill="#8B6A3E" transform="rotate(15)"/>
      <rect x="-40" y="0" width="80" height="12" rx="6" fill="#7A5A30" transform="rotate(-15)"/>
      <!-- Flammes -->
      <ellipse cx="0" cy="-20" rx="25" ry="35" fill="#F0C850" opacity="0.8"/>
      <ellipse cx="0" cy="-25" rx="15" ry="25" fill="#E88040" opacity="0.7"/>
      <ellipse cx="0" cy="-30" rx="8" ry="15" fill="#F0E0A0" opacity="0.9"/>
      <!-- Lueur -->
      <circle cx="0" cy="-15" r="80" fill="#F0C850" opacity="0.06"/>
    </g>

    <!-- ═══ PAPY BABOU (centre, assis, raconte) ═══ -->
    <g transform="translate(1500, 1700)">
      <ellipse cx="0" cy="300" rx="90" ry="16" fill="#8B7A4A" opacity="0.4"/>

      <!-- Jambes croisées (assis) -->
      <ellipse cx="-30" cy="245" rx="45" ry="18" fill="#3A5E8C" transform="rotate(-10)"/>
      <ellipse cx="30" cy="245" rx="45" ry="18" fill="#3A5E8C" transform="rotate(10)"/>
      <ellipse cx="-50" cy="255" rx="18" ry="10" fill="#8B6A3E"/>
      <ellipse cx="50" cy="255" rx="18" ry="10" fill="#8B6A3E"/>

      <!-- Corps -->
      <rect x="-55" y="130" width="110" height="120" rx="30" fill="#C49A6C"/>
      <rect x="-25" y="125" width="50" height="22" rx="8" fill="#F5ECD5"/>
      <circle cx="0" cy="170" r="4.5" fill="#8B6A3E"/>
      <circle cx="0" cy="192" r="4.5" fill="#8B6A3E"/>

      <!-- Bras gauche (geste de conteur, ouvert) -->
      <rect x="-110" y="120" width="60" height="20" rx="10" fill="#F2C9A0" transform="rotate(-35, -55, 145)"/>
      <circle cx="-120" cy="80" r="15" fill="#F2C9A0"/>

      <!-- Bras droit (tient le livre ouvert) -->
      <rect x="50" y="135" width="60" height="20" rx="10" fill="#F2C9A0" transform="rotate(20, 55, 145)"/>
      <circle cx="110" cy="165" r="15" fill="#F2C9A0"/>

      <!-- Petit livre dans la main -->
      <g transform="translate(115, 145) rotate(10)">
        <rect x="-20" y="-15" width="18" height="28" rx="3" fill="#FDF5E6"/>
        <rect x="0" y="-15" width="18" height="28" rx="3" fill="#FDF5E6"/>
        <rect x="-3" y="-16" width="6" height="30" rx="2" fill="#C49A6C"/>
      </g>

      <!-- Tête -->
      <circle cx="0" cy="30" r="115" fill="#F2C9A0"/>

      <!-- Cheveux -->
      <path d="M-88,10 Q-95,-55 -65,-82 Q-30,-110 0,-105 Q30,-110 65,-82 Q95,-55 88,10" fill="#E0DDD5"/>
      <ellipse cx="-92" cy="-5" rx="28" ry="38" fill="#E0DDD5"/>
      <ellipse cx="92" cy="-5" rx="28" ry="38" fill="#E0DDD5"/>

      <!-- Oreilles -->
      <circle cx="-108" cy="28" r="16" fill="#F2C9A0"/>
      <circle cx="108" cy="28" r="16" fill="#F2C9A0"/>

      <!-- Yeux — doux, raconteur -->
      <circle cx="-28" cy="15" r="7" fill="#2D2D2D"/>
      <circle cx="28" cy="15" r="7" fill="#2D2D2D"/>
      <circle cx="-25" cy="12" r="2.5" fill="#FFFFFF"/>
      <circle cx="31" cy="12" r="2.5" fill="#FFFFFF"/>

      <!-- Lunettes fines -->
      <circle cx="-28" cy="15" r="20" fill="none" stroke="#D4A840" stroke-width="3.5"/>
      <circle cx="28" cy="15" r="20" fill="none" stroke="#D4A840" stroke-width="3.5"/>
      <line x1="-8" y1="15" x2="8" y2="15" stroke="#D4A840" stroke-width="2.5"/>

      <!-- Nez -->
      <ellipse cx="0" cy="36" rx="7" ry="5" fill="#E5B88A"/>

      <!-- Moustache -->
      <path d="M-20,46 Q0,56 20,46" fill="#C8C4BC"/>

      <!-- Sourire chaleureux -->
      <path d="M-16,55 Q0,68 16,55" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

      <!-- Joues -->
      <circle cx="-52" cy="38" r="16" fill="#F0988C" opacity="0.3"/>
      <circle cx="52" cy="38" r="16" fill="#F0988C" opacity="0.3"/>
    </g>

    <!-- ═══ ANTOINE (gauche, assis, écoute) ═══ -->
    <g transform="translate(900, 1950)">
      <ellipse cx="0" cy="215" rx="60" ry="12" fill="#8B7A4A" opacity="0.3"/>

      <!-- Assis jambes devant -->
      <ellipse cx="-15" cy="182" rx="35" ry="14" fill="#3A5E8C"/>
      <ellipse cx="25" cy="182" rx="35" ry="14" fill="#3A5E8C"/>

      <!-- Corps -->
      <rect x="-38" y="95" width="76" height="90" rx="22" fill="#5A9FD4"/>

      <!-- Bras sur les genoux -->
      <rect x="-52" y="135" width="40" height="15" rx="7" fill="#F2C9A0" transform="rotate(25, -38, 145)"/>
      <circle cx="-55" cy="160" r="12" fill="#F2C9A0"/>
      <rect x="12" y="135" width="40" height="15" rx="7" fill="#F2C9A0" transform="rotate(-25, 38, 145)"/>
      <circle cx="55" cy="160" r="12" fill="#F2C9A0"/>

      <!-- Tête (tournée vers Papy) -->
      <circle cx="0" cy="15" r="85" fill="#F2C9A0"/>

      <!-- Cheveux -->
      <path d="M-65,-3 Q-70,-48 -45,-65 Q-20,-82 0,-78 Q20,-82 45,-65 Q70,-48 65,-3" fill="#8B6A3E"/>
      <path d="M-3,-78 Q0,-98 8,-94 Q5,-85 3,-78" fill="#8B6A3E"/>

      <!-- Yeux écarquillés (émerveillé) -->
      <circle cx="-20" cy="5" r="8" fill="#2D2D2D"/>
      <circle cx="20" cy="5" r="8" fill="#2D2D2D"/>
      <circle cx="-17" cy="2" r="3" fill="#FFFFFF"/>
      <circle cx="23" cy="2" r="3" fill="#FFFFFF"/>

      <!-- Bouche ouverte -->
      <ellipse cx="0" cy="38" rx="10" ry="8" fill="#2D2D2D"/>

      <!-- Taches de rousseur -->
      <circle cx="-32" cy="18" r="2.5" fill="#D4A06A" opacity="0.5"/>
      <circle cx="-26" cy="24" r="2" fill="#D4A06A" opacity="0.4"/>
      <circle cx="32" cy="18" r="2.5" fill="#D4A06A" opacity="0.5"/>

      <!-- Joues -->
      <circle cx="-38" cy="22" r="12" fill="#F0988C" opacity="0.35"/>
      <circle cx="38" cy="22" r="12" fill="#F0988C" opacity="0.35"/>
    </g>

    <!-- ═══ NOEMIE (droite, endormie contre Papy) ═══ -->
    <g transform="translate(2050, 2000)">
      <ellipse cx="0" cy="195" rx="55" ry="10" fill="#8B7A4A" opacity="0.3"/>

      <!-- Assise/penchée -->
      <ellipse cx="-10" cy="165" rx="30" ry="12" fill="#F5ECD5"/>
      <ellipse cx="20" cy="165" rx="30" ry="12" fill="#F5ECD5"/>

      <!-- Corps (robe rose) -->
      <rect x="-32" y="85" width="64" height="80" rx="20" fill="#E895A8"/>

      <!-- Bras (tient le doudou) -->
      <rect x="-48" y="100" width="36" height="14" rx="7" fill="#F2C9A0" transform="rotate(20, -32, 108)"/>
      <circle cx="-50" cy="120" r="10" fill="#F2C9A0"/>

      <!-- Doudou lapin -->
      <g transform="translate(-58, 115)">
        <ellipse cx="0" cy="8" rx="10" ry="13" fill="#FFFFFF"/>
        <circle cx="0" cy="-4" r="8" fill="#FFFFFF"/>
        <ellipse cx="-4" cy="-12" rx="3" ry="8" fill="#FFFFFF"/>
        <ellipse cx="4" cy="-12" rx="3" ry="8" fill="#FFFFFF"/>
        <circle cx="-2.5" cy="-5" r="1.5" fill="#2D2D2D"/>
        <circle cx="2.5" cy="-5" r="1.5" fill="#2D2D2D"/>
      </g>

      <!-- Tête (légèrement penchée) -->
      <circle cx="0" cy="10" r="75" fill="#F2C9A0" transform="rotate(-8)"/>

      <!-- Cheveux blonds + boucles -->
      <path d="M-58,-3 Q-62,-40 -36,-55 Q-15,-68 0,-65 Q15,-68 36,-55 Q62,-40 58,-3" fill="#F0C850" transform="rotate(-8)"/>
      <circle cx="-58" cy="-10" r="14" fill="#F0C850"/>
      <circle cx="52" cy="-18" r="14" fill="#F0C850"/>
      <circle cx="-50" cy="8" r="10" fill="#F0C850"/>
      <circle cx="46" cy="0" r="10" fill="#F0C850"/>

      <!-- Noeud -->
      <g transform="translate(12, -62) rotate(-8)">
        <ellipse cx="-9" cy="0" rx="10" ry="6" fill="#E06050"/>
        <ellipse cx="9" cy="0" rx="10" ry="6" fill="#E06050"/>
        <circle cx="0" cy="0" r="4" fill="#C43A2F"/>
      </g>

      <!-- Yeux fermés (dort) — petits arcs -->
      <path d="M-24,2 Q-17,-4 -10,2" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>
      <path d="M10,0 Q17,-6 24,0" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

      <!-- Nez -->
      <ellipse cx="0" cy="18" rx="4" ry="3" fill="#E5B88A"/>

      <!-- Petit sourire endormi -->
      <path d="M-10,28 Q0,34 10,28" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Joues -->
      <circle cx="-32" cy="18" r="11" fill="#F0988C" opacity="0.4"/>
      <circle cx="32" cy="14" r="11" fill="#F0988C" opacity="0.4"/>

      <!-- Petits Z (dort) -->
      <g fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4" stroke-linecap="round">
        <text x="45" y="-30" font-family="sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.4">z</text>
        <text x="60" y="-50" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" opacity="0.3">z</text>
        <text x="72" y="-65" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" opacity="0.2">z</text>
      </g>
    </g>

    <!-- ═══ TEXTE ═══ -->
    <rect x="250" y="200" width="2500" height="440" rx="30" fill="#E06050" opacity="0.9"/>

    <text x="1500" y="360"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="95"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="6"
          opacity="0.9">LES HISTOIRES DE</text>

    <text x="1500" y="560"
          text-anchor="middle"
          font-family="'Baloo 2', cursive"
          font-size="250"
          font-weight="800"
          fill="#FFFFFF"
          letter-spacing="6">Papy Babou</text>

    <rect x="750" y="2800" width="1500" height="70" rx="35" fill="#D4A840" opacity="0.85"/>
    <text x="1500" y="2850"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="42"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="4">PODCAST BIBLIQUE POUR ENFANTS</text>

  </g>
</svg>
