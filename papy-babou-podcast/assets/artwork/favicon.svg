<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2D4A7A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A84C"/>
      <stop offset="100%" stop-color="#B86E20"/>
    </linearGradient>
  </defs>

  <!-- Fond cercle indigo profond -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Anneau dore -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#B86E20" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#D4883A" stroke-width="2" opacity="0.3"/>

  <!-- Rose des vents -->
  <g transform="translate(256, 256)">
    <!-- 4 pointes principales -->
    <polygon points="0,-175 12,-35 0,-50 -12,-35" fill="#E8A84C"/><!-- N -->
    <polygon points="0,175 12,35 0,50 -12,35" fill="#D4883A"/><!-- S -->
    <polygon points="-175,0 -35,12 -50,0 -35,-12" fill="#D4883A"/><!-- O -->
    <polygon points="175,0 35,12 50,0 35,-12" fill="#D4883A"/><!-- E -->

    <!-- 4 pointes intermediaires -->
    <polygon points="-120,-120 -18,-25 -30,-30 -25,-18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="120,-120 18,-25 30,-30 25,-18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="-120,120 -18,25 -30,30 -25,18" fill="#E8A84C" opacity="0.6"/>
    <polygon points="120,120 18,25 30,30 25,18" fill="#E8A84C" opacity="0.6"/>

    <!-- Centre -->
    <circle cx="0" cy="0" r="16" fill="url(#gold)" stroke="#8B6914" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#FDF5E6"/>
  </g>

  <!-- Etoile de Bethlehem (petite, en haut) -->
  <polygon points="256,55 262,75 282,75 266,87 272,107 256,95 240,107 246,87 230,75 250,75"
           fill="#FFF8D0" opacity="0.8"/>

  <!-- Lunettes de Papy (signature, bas) -->
  <g transform="translate(256, 410)">
    <circle cx="-18" cy="0" r="16" fill="none" stroke="#E8A84C" stroke-width="4"/>
    <circle cx="18" cy="0" r="16" fill="none" stroke="#E8A84C" stroke-width="4"/>
    <line x1="2" y1="0" x2="-2" y2="0" stroke="#E8A84C" stroke-width="4"/>
    <line x1="-34" y1="-5" x2="-42" y2="-10" stroke="#E8A84C" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="-5" x2="42" y2="-10" stroke="#E8A84C" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
