<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="atBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2D4A7A"/>
    </linearGradient>
    <linearGradient id="atGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C44A"/>
      <stop offset="100%" stop-color="#856F14"/>
    </linearGradient>
  </defs>

  <!-- Fond carre arrondi (iOS le clippera lui-meme) -->
  <rect width="180" height="180" rx="36" fill="url(#atBg)"/>

  <!-- Anneau dore -->
  <circle cx="90" cy="85" r="68" fill="none" stroke="#856F14" stroke-width="2.5" opacity="0.5"/>

  <!-- Rose des vents -->
  <g transform="translate(90, 85)">
    <!-- 4 pointes principales -->
    <polygon points="0,-58 4,-12 0,-18 -4,-12" fill="#E8C44A"/>
    <polygon points="0,58 4,12 0,18 -4,12" fill="#D4883A"/>
    <polygon points="-58,0 -12,4 -18,0 -12,-4" fill="#D4883A"/>
    <polygon points="58,0 12,4 18,0 12,-4" fill="#D4883A"/>
    <!-- 4 diagonales -->
    <polygon points="-40,-40 -7,-9 -11,-11 -9,-7" fill="#E8C44A" opacity="0.5"/>
    <polygon points="40,-40 7,-9 11,-11 9,-7" fill="#E8C44A" opacity="0.5"/>
    <polygon points="-40,40 -7,9 -11,11 -9,7" fill="#E8C44A" opacity="0.5"/>
    <polygon points="40,40 7,9 11,11 9,7" fill="#E8C44A" opacity="0.5"/>
    <!-- Centre -->
    <circle cx="0" cy="0" r="6" fill="url(#atGold)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FDF5E6"/>
  </g>

  <!-- Texte "PB" en bas -->
  <text x="90" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#E8C44A" letter-spacing="3">PB</text>
</svg>
