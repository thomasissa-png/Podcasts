<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <radialGradient id="skinFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="80%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E0B080"/>
    </radialGradient>
    <radialGradient id="skinHand" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2C3E6B"/>
      <stop offset="100%" stop-color="#1A2744"/>
    </linearGradient>
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E8E4DE"/>
      <stop offset="100%" stop-color="#C0B8AC"/>
    </radialGradient>
    <radialGradient id="scalpGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="60%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7AA0C4"/>
      <stop offset="60%" stop-color="#4A7A9F"/>
      <stop offset="100%" stop-color="#3A6080"/>
    </radialGradient>
    <!-- Ciel coucher de soleil -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="30%" stop-color="#FFB366"/>
      <stop offset="60%" stop-color="#FFD4A0"/>
      <stop offset="100%" stop-color="#F0E8D0"/>
    </linearGradient>
    <!-- Herbe -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9A3A"/>
      <stop offset="100%" stop-color="#3A7A2A"/>
    </linearGradient>
    <!-- Enfant peau -->
    <radialGradient id="childSkin" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE0C0"/>
      <stop offset="80%" stop-color="#F5D0A5"/>
      <stop offset="100%" stop-color="#E8C090"/>
    </radialGradient>
    <!-- Soleil -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE080"/>
      <stop offset="60%" stop-color="#FFD040"/>
      <stop offset="100%" stop-color="#FFA020"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ciel coucher de soleil -->
  <rect width="3000" height="3000" fill="url(#skyGrad)"/>

  <!-- Soleil -->
  <circle cx="2400" cy="500" r="250" fill="url(#sunGrad)" opacity="0.8"/>
  <circle cx="2400" cy="500" r="300" fill="#FFD040" opacity="0.1"/>

  <!-- Nuages -->
