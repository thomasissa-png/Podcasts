    <ellipse cx="500" cy="380" rx="120" ry="45" fill="#FFFFFF"/>
    <ellipse cx="700" cy="390" rx="130" ry="50" fill="#FFFFFF"/>
    <ellipse cx="1800" cy="300" rx="180" ry="55" fill="#FFFFFF"/>
    <ellipse cx="1700" cy="280" rx="110" ry="40" fill="#FFFFFF"/>
