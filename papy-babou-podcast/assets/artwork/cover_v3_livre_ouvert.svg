<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <clipPath id="c3"><rect width="3000" height="3000" rx="100" ry="100"/></clipPath>
  </defs>
  <g clip-path="url(#c3)">

    <!-- Fond parchemin chaud -->
    <rect width="3000" height="3000" fill="#F5E6C8"/>

    <!-- Grand livre ouvert (occupe la majorité de l'image) -->
    <g transform="translate(1500, 1600)">
      <!-- Page gauche -->
      <rect x="-650" y="-400" width="620" height="750" rx="15" fill="#FDF8EE" stroke="#D4C0A0" stroke-width="3"/>
      <!-- Page droite -->
      <rect x="30" y="-400" width="620" height="750" rx="15" fill="#FDF8EE" stroke="#D4C0A0" stroke-width="3"/>
      <!-- Reliure -->
      <rect x="-32" y="-410" width="64" height="770" rx="8" fill="#C49A6C" stroke="#A8845A" stroke-width="3"/>
      <!-- Ombre reliure -->
      <rect x="-18" y="-400" width="36" height="750" fill="#B89060" opacity="0.3"/>
    </g>

    <!-- ═══ Scène biblique DANS le livre (page gauche) — Mer Rouge ═══ -->
    <g transform="translate(850, 1600)">
      <!-- Mini ciel -->
      <rect x="-280" y="-350" width="560" height="200" fill="#B3DAF1" rx="8"/>
      <!-- Mini soleil -->
      <circle cx="180" cy="-280" r="30" fill="#F0C850" opacity="0.7"/>
      <!-- Vagues de la mer -->
      <g fill="#5A9FD4" opacity="0.6">
        <ellipse cx="-100" cy="-120" rx="120" ry="30"/>
        <ellipse cx="100" cy="-100" rx="130" ry="25"/>
        <ellipse cx="-50" cy="-80" rx="140" ry="28"/>
      </g>
      <!-- Passage ouvert (chemin sec) -->
      <rect x="-30" y="-150" width="60" height="150" fill="#E8D5A8" rx="5"/>
      <!-- Petit personnage (Moïse figurine) -->
      <g transform="translate(0, -170) scale(0.4)">
        <circle cx="0" cy="0" r="40" fill="#F2C9A0"/>
        <rect x="-20" y="35" width="40" height="50" rx="12" fill="#D4AA7C"/>
        <circle cx="-10" cy="-5" r="4" fill="#2D2D2D"/>
        <circle cx="10" cy="-5" r="4" fill="#2D2D2D"/>
        <path d="M-8,12 Q0,18 8,12" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
        <!-- Barbe blanche -->
        <path d="M-15,15 Q0,35 15,15" fill="#E0DDD5"/>
        <!-- Bâton -->
        <rect x="35" y="-40" width="6" height="100" rx="3" fill="#8B6A3E"/>
      </g>
    </g>

    <!-- ═══ Scène sur page droite — Les 3 personnages lisent ═══ -->
    <g transform="translate(2150, 1500)">

      <!-- PAPY (centre, assis) -->
      <g transform="translate(0, 50) scale(0.7)">
        <!-- Jambes -->
        <ellipse cx="-20" cy="230" rx="35" ry="14" fill="#3A5E8C"/>
        <ellipse cx="30" cy="230" rx="35" ry="14" fill="#3A5E8C"/>
        <!-- Corps -->
        <rect x="-45" y="120" width="90" height="110" rx="25" fill="#C49A6C"/>
        <circle cx="0" cy="165" r="4" fill="#8B6A3E"/>
        <circle cx="0" cy="185" r="4" fill="#8B6A3E"/>
        <!-- Bras ouverts (conteur) -->
        <rect x="-95" y="115" width="55" height="18" rx="9" fill="#F2C9A0" transform="rotate(-20, -50, 135)"/>
        <circle cx="-100" cy="95" r="13" fill="#F2C9A0"/>
        <rect x="42" y="115" width="55" height="18" rx="9" fill="#F2C9A0" transform="rotate(20, 50, 135)"/>
        <circle cx="100" cy="95" r="13" fill="#F2C9A0"/>
        <!-- Tête -->
        <circle cx="0" cy="25" r="100" fill="#F2C9A0"/>
        <path d="M-78,8 Q-84,-46 -56,-70 Q-26,-95 0,-90 Q26,-95 56,-70 Q84,-46 78,8" fill="#E0DDD5"/>
        <ellipse cx="-80" cy="-2" rx="24" ry="32" fill="#E0DDD5"/>
        <ellipse cx="80" cy="-2" rx="24" ry="32" fill="#E0DDD5"/>
        <circle cx="-95" cy="24" r="14" fill="#F2C9A0"/>
        <circle cx="95" cy="24" r="14" fill="#F2C9A0"/>
        <!-- Yeux -->
        <circle cx="-25" cy="12" r="6" fill="#2D2D2D"/>
        <circle cx="25" cy="12" r="6" fill="#2D2D2D"/>
        <circle cx="-22" cy="10" r="2.2" fill="#FFFFFF"/>
        <circle cx="28" cy="10" r="2.2" fill="#FFFFFF"/>
        <!-- Lunettes -->
        <circle cx="-25" cy="12" r="18" fill="none" stroke="#D4A840" stroke-width="3"/>
        <circle cx="25" cy="12" r="18" fill="none" stroke="#D4A840" stroke-width="3"/>
        <line x1="-7" y1="12" x2="7" y2="12" stroke="#D4A840" stroke-width="2"/>
        <!-- Nez -->
        <ellipse cx="0" cy="30" rx="6" ry="4.5" fill="#E5B88A"/>
        <!-- Moustache -->
        <path d="M-16,40 Q0,48 16,40" fill="#C8C4BC"/>
        <!-- Sourire -->
        <path d="M-14,48 Q0,60 14,48" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Joues -->
        <circle cx="-46" cy="32" r="14" fill="#F0988C" opacity="0.3"/>
        <circle cx="46" cy="32" r="14" fill="#F0988C" opacity="0.3"/>
      </g>

      <!-- ANTOINE (gauche de Papy) -->
      <g transform="translate(-200, 130) scale(0.55)">
        <rect x="-35" y="95" width="70" height="80" rx="20" fill="#5A9FD4"/>
        <circle cx="0" cy="15" r="78" fill="#F2C9A0"/>
        <path d="M-60,-2 Q-64,-42 -40,-58 Q-18,-72 0,-68 Q18,-72 40,-58 Q64,-42 60,-2" fill="#8B6A3E"/>
        <path d="M-2,-68 Q0,-85 6,-82 Q4,-74 2,-68" fill="#8B6A3E"/>
        <circle cx="-18" cy="6" r="6" fill="#2D2D2D"/>
        <circle cx="18" cy="6" r="6" fill="#2D2D2D"/>
        <circle cx="-15" cy="4" r="2.2" fill="#FFFFFF"/>
        <circle cx="21" cy="4" r="2.2" fill="#FFFFFF"/>
        <ellipse cx="0" cy="22" rx="4.5" ry="3.5" fill="#E5B88A"/>
        <path d="M-12,34 Q0,44 12,34" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-32" cy="20" r="10" fill="#F0988C" opacity="0.35"/>
        <circle cx="32" cy="20" r="10" fill="#F0988C" opacity="0.35"/>
      </g>

      <!-- NOEMIE (droite de Papy) -->
      <g transform="translate(200, 140) scale(0.5)">
        <rect x="-30" y="85" width="60" height="75" rx="18" fill="#E895A8"/>
        <circle cx="0" cy="10" r="70" fill="#F2C9A0"/>
        <path d="M-54,-3 Q-56,-38 -34,-52 Q-14,-64 0,-60 Q14,-64 34,-52 Q56,-38 54,-3" fill="#F0C850"/>
        <circle cx="-54" cy="-12" r="13" fill="#F0C850"/>
        <circle cx="54" cy="-12" r="13" fill="#F0C850"/>
        <g transform="translate(10, -58)">
          <ellipse cx="-8" cy="0" rx="8" ry="5" fill="#E06050"/>
          <ellipse cx="8" cy="0" rx="8" ry="5" fill="#E06050"/>
          <circle cx="0" cy="0" r="3.5" fill="#C43A2F"/>
        </g>
        <circle cx="-16" cy="2" r="5.5" fill="#2D2D2D"/>
        <circle cx="16" cy="2" r="5.5" fill="#2D2D2D"/>
        <circle cx="-13" cy="0" r="2" fill="#FFFFFF"/>
        <circle cx="19" cy="0" r="2" fill="#FFFFFF"/>
        <ellipse cx="0" cy="18" rx="4" ry="3" fill="#E5B88A"/>
        <path d="M-10,28 Q0,36 10,28" fill="none" stroke="#2D2D2D" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="-30" cy="15" r="10" fill="#F0988C" opacity="0.4"/>
        <circle cx="30" cy="15" r="10" fill="#F0988C" opacity="0.4"/>
      </g>
    </g>

    <!-- Étoiles dorées sortant du livre -->
    <g fill="#F0C850" opacity="0.5">
      <polygon points="1500,900 1508,920 1530,920 1512,934 1520,958 1500,944 1480,958 1488,934 1470,920 1492,920" transform="scale(1.5) translate(-500,-200)"/>
      <polygon points="1200,1000 1206,1016 1224,1016 1210,1026 1216,1044 1200,1034 1184,1044 1190,1026 1176,1016 1194,1016" transform="scale(1.2) translate(-100,-100)"/>
      <polygon points="1800,950 1806,966 1824,966 1810,976 1816,994 1800,984 1784,994 1790,976 1776,966 1794,966" transform="scale(1.3) translate(80,-150)"/>
    </g>

    <!-- ═══ TEXTE ═══ -->
    <!-- Bandeau titre -->
    <rect x="200" y="150" width="2600" height="450" rx="30" fill="#5A9FD4" opacity="0.9"/>

    <text x="1500" y="320"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="100"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="6"
          opacity="0.9">LES HISTOIRES DE</text>

    <text x="1500" y="520"
          text-anchor="middle"
          font-family="'Baloo 2', cursive"
          font-size="260"
          font-weight="800"
          fill="#FFFFFF"
          letter-spacing="6">Papy Babou</text>

    <!-- Sous-titre -->
    <rect x="650" y="2750" width="1700" height="75" rx="38" fill="#E06050" opacity="0.85"/>
    <text x="1500" y="2804"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="45"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="4">PODCAST BIBLIQUE POUR ENFANTS</text>

  </g>
</svg>
