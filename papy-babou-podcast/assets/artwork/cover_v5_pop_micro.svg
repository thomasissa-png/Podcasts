<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <linearGradient id="v5Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B5E"/>
      <stop offset="30%" stop-color="#F5A020"/>
      <stop offset="60%" stop-color="#FFD234"/>
      <stop offset="100%" stop-color="#7BCBF5"/>
    </linearGradient>
    <clipPath id="v5Clip">
      <rect width="3000" height="3000" rx="140" ry="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v5Clip)">

    <!-- ══════ FOND GRADIENT VIVE ══════ -->
    <rect width="3000" height="3000" fill="url(#v5Bg)"/>

    <!-- Motif halftone subtil -->
    <g fill="#FFFFFF" opacity="0.06">
      <circle cx="100" cy="100" r="20"/><circle cx="200" cy="100" r="20"/><circle cx="300" cy="100" r="20"/>
      <circle cx="400" cy="100" r="20"/><circle cx="500" cy="100" r="20"/><circle cx="600" cy="100" r="20"/>
      <circle cx="150" cy="180" r="18"/><circle cx="250" cy="180" r="18"/><circle cx="350" cy="180" r="18"/>
      <circle cx="450" cy="180" r="18"/><circle cx="550" cy="180" r="18"/><circle cx="650" cy="180" r="18"/>
      <circle cx="100" cy="260" r="16"/><circle cx="200" cy="260" r="16"/><circle cx="300" cy="260" r="16"/>
      <circle cx="400" cy="260" r="16"/><circle cx="500" cy="260" r="16"/><circle cx="600" cy="260" r="16"/>
    </g>

    <!-- Éclats graphiques -->
    <g fill="#FFFFFF" opacity="0.12">
      <!-- Éclat top-left -->
      <polygon points="250,400 200,200 350,300"/>
      <polygon points="250,400 100,350 200,200"/>
      <polygon points="250,400 350,300 400,450"/>
      <polygon points="250,400 400,450 300,550"/>
      <polygon points="250,400 300,550 100,500"/>
      <polygon points="250,400 100,500 100,350"/>
      <!-- Éclat bottom-right -->
      <polygon points="2700,2600 2650,2400 2800,2500"/>
      <polygon points="2700,2600 2550,2550 2650,2400"/>
      <polygon points="2700,2600 2800,2500 2850,2650"/>
      <polygon points="2700,2600 2850,2650 2750,2750"/>
      <polygon points="2700,2600 2750,2750 2550,2700"/>
      <polygon points="2700,2600 2550,2700 2550,2550"/>
    </g>

    <!-- ══════ GRAND CERCLE BLANC CENTRAL ══════ -->
    <circle cx="1500" cy="1550" r="850" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="1500" cy="1550" r="810" fill="#FFF8ED"/>

    <!-- ══════ MICRO STYLISE (arrière-plan dans le cercle) ══════ -->
    <g transform="translate(1500, 1900)" opacity="0.08">
      <rect x="-30" y="-400" width="60" height="300" rx="10" fill="#2D2D2D"/>
      <ellipse cx="0" cy="-400" rx="80" ry="120" fill="#2D2D2D"/>
      <path d="M-120,-350 Q-120,-500 0,-520 Q120,-500 120,-350" fill="none" stroke="#2D2D2D" stroke-width="15"/>
      <line x1="0" y1="-100" x2="0" y2="0" stroke="#2D2D2D" stroke-width="15"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#2D2D2D" stroke-width="15" stroke-linecap="round"/>
    </g>

    <!-- ══════ PAPY BABOU (centre, avec casque audio) ══════ -->
    <g transform="translate(1500, 1450)">
      <!-- Corps -->
      <ellipse cx="0" cy="200" rx="110" ry="100" fill="#D2B48C" stroke="#2D2D2D" stroke-width="8"/>
      <rect x="-40" y="110" width="80" height="40" rx="8" fill="#F0E0C0" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="0" cy="170" r="6" fill="#2D2D2D"/>
      <circle cx="0" cy="200" r="6" fill="#2D2D2D"/>

      <!-- GROSSE TETE -->
      <circle cx="0" cy="-10" r="130" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="8"/>

      <!-- Cheveux blancs -->
      <ellipse cx="-105" cy="-45" rx="45" ry="52" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="105" cy="-45" rx="45" ry="52" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M-55,-135 Q0,-158 55,-135" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>

      <!-- Casque audio (par-dessus les cheveux) -->
      <path d="M-125,-50 Q-135,-120 -80,-150 Q-30,-175 0,-175 Q30,-175 80,-150 Q135,-120 125,-50"
            fill="none" stroke="#2D2D2D" stroke-width="20" stroke-linecap="round"/>
      <!-- Écouteur gauche -->
      <ellipse cx="-130" cy="-30" rx="35" ry="45" fill="#F26B5E" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="-130" cy="-30" rx="20" ry="30" fill="#D4486B" stroke="#2D2D2D" stroke-width="4"/>
      <!-- Écouteur droit -->
      <ellipse cx="130" cy="-30" rx="35" ry="45" fill="#F26B5E" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="130" cy="-30" rx="20" ry="30" fill="#D4486B" stroke="#2D2D2D" stroke-width="4"/>

      <!-- Oreilles -->
      <ellipse cx="-122" cy="0" rx="18" ry="25" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="122" cy="0" rx="18" ry="25" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- GRANDS YEUX pétillants -->
      <ellipse cx="-40" cy="-15" rx="30" ry="32" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="40" cy="-15" rx="30" ry="32" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-35" cy="-13" r="18" fill="#5A7A9A"/>
      <circle cx="45" cy="-13" r="18" fill="#5A7A9A"/>
      <circle cx="-33" cy="-15" r="10" fill="#2D2D2D"/>
      <circle cx="47" cy="-15" r="10" fill="#2D2D2D"/>
      <circle cx="-40" cy="-24" r="7" fill="#FFFFFF"/>
      <circle cx="40" cy="-24" r="7" fill="#FFFFFF"/>
      <circle cx="-28" cy="-10" r="4" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="52" cy="-10" r="4" fill="#FFFFFF" opacity="0.6"/>

      <!-- Sourcils -->
      <path d="M-65,-50 Q-40,-62 -15,-52" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      <path d="M15,-52 Q40,-62 65,-50" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>

      <!-- LUNETTES -->
      <circle cx="-40" cy="-15" r="34" fill="none" stroke="#E8C44A" stroke-width="9"/>
      <circle cx="40" cy="-15" r="34" fill="none" stroke="#E8C44A" stroke-width="9"/>
      <line x1="-5" y1="-17" x2="5" y2="-17" stroke="#E8C44A" stroke-width="7"/>

      <!-- Nez -->
      <ellipse cx="0" cy="12" rx="14" ry="10" fill="#E8B88A" stroke="#2D2D2D" stroke-width="4"/>

      <!-- Moustache -->
      <path d="M-38,26 Q-20,38 0,30 Q20,38 38,26" fill="#C0C0C0" stroke="#2D2D2D" stroke-width="5"/>

      <!-- ENORME sourire -->
      <path d="M-40,45 Q0,75 40,45" fill="#2D2D2D" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M-30,47 Q0,55 30,47" fill="#FFFFFF" opacity="0.4"/>

      <!-- Joues roses -->
      <circle cx="-75" cy="18" r="20" fill="#F26B5E" opacity="0.35"/>
      <circle cx="75" cy="18" r="20" fill="#F26B5E" opacity="0.35"/>

      <!-- Bras — un clin d'oeil/thumbs up -->
      <path d="M-110,160 Q-170,120 -190,80" fill="none" stroke="#D2B48C" stroke-width="42" stroke-linecap="round"/>
      <circle cx="-190" cy="80" r="22" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <rect x="-200" y="35" width="14" height="40" rx="7" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>

      <path d="M110,160 Q170,130 190,100" fill="none" stroke="#D2B48C" stroke-width="42" stroke-linecap="round"/>
      <circle cx="190" cy="100" r="22" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- Jambes -->
      <rect x="-65" y="280" width="50" height="70" rx="20" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="6"/>
      <rect x="15" y="280" width="50" height="70" rx="20" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="-40" cy="358" rx="35" ry="16" fill="#8B6914" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="40" cy="358" rx="35" ry="16" fill="#8B6914" stroke="#2D2D2D" stroke-width="5"/>
    </g>

    <!-- ══════ ANTOINE (gauche du cercle) ══════ -->
    <g transform="translate(800, 1750) scale(0.65)">
      <ellipse cx="0" cy="130" rx="70" ry="65" fill="#4A9FE5" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-10" r="95" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-80,-32 Q-85,-90 -52,-102 Q-22,-118 0,-112 Q22,-118 52,-102 Q85,-88 80,-32" fill="#8B6914" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M5,-112 Q10,-142 18,-138 Q14,-128 12,-112" fill="#8B6914" stroke="#2D2D2D" stroke-width="4"/>
      <ellipse cx="-26" cy="-6" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="26" cy="-6" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-21" cy="-4" r="13" fill="#2D5B9E"/>
      <circle cx="31" cy="-4" r="13" fill="#2D5B9E"/>
      <circle cx="-19" cy="-6" r="7" fill="#2D2D2D"/>
      <circle cx="33" cy="-6" r="7" fill="#2D2D2D"/>
      <circle cx="-26" cy="-14" r="5" fill="#FFFFFF"/>
      <circle cx="26" cy="-14" r="5" fill="#FFFFFF"/>
      <!-- Grand sourire -->
      <path d="M-22,30 Q0,50 22,30" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-48" cy="14" r="14" fill="#F26B5E" opacity="0.35"/>
      <circle cx="48" cy="14" r="14" fill="#F26B5E" opacity="0.35"/>
      <!-- Bras dansant -->
      <path d="M-65,105 Q-110,70 -120,35" fill="none" stroke="#4A9FE5" stroke-width="30" stroke-linecap="round"/>
      <circle cx="-120" cy="35" r="14" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M65,105 Q110,80 125,50" fill="none" stroke="#4A9FE5" stroke-width="30" stroke-linecap="round"/>
      <circle cx="125" cy="50" r="14" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
    </g>

    <!-- ══════ NOEMIE (droite du cercle) ══════ -->
    <g transform="translate(2200, 1780) scale(0.6)">
      <ellipse cx="0" cy="120" rx="65" ry="60" fill="#E895A8" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-15" r="88" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-74,-27 Q-78,-82 -46,-94 Q-20,-108 0,-102 Q20,-108 46,-94 Q78,-78 74,-27" fill="#FFD234" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-74" cy="-44" r="16" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="74" cy="-44" r="16" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <path d="M8,-96 Q18,-112 28,-96" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M8,-96 Q18,-80 28,-96" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <circle cx="18" cy="-96" r="5" fill="#D4486B" stroke="#2D2D2D" stroke-width="3"/>
      <ellipse cx="-24" cy="-8" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="24" cy="-8" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-28" cy="-6" r="12" fill="#4A9FE5"/>
      <circle cx="20" cy="-6" r="12" fill="#4A9FE5"/>
      <circle cx="-29" cy="-8" r="6.5" fill="#2D2D2D"/>
      <circle cx="19" cy="-8" r="6.5" fill="#2D2D2D"/>
      <circle cx="-24" cy="-16" r="4.5" fill="#FFFFFF"/>
      <circle cx="24" cy="-16" r="4.5" fill="#FFFFFF"/>
      <!-- Sourire chipie -->
      <path d="M-20,24 Q0,42 20,24" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-48" cy="14" r="14" fill="#F26B5E" opacity="0.4"/>
      <circle cx="48" cy="14" r="14" fill="#F26B5E" opacity="0.4"/>
      <!-- Bras qui danse -->
      <path d="M-60,95 Q-100,55 -110,20" fill="none" stroke="#E895A8" stroke-width="26" stroke-linecap="round"/>
      <circle cx="-110" cy="20" r="13" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M60,95 Q100,60 115,30" fill="none" stroke="#E895A8" stroke-width="26" stroke-linecap="round"/>
      <circle cx="115" cy="30" r="13" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
    </g>

    <!-- ══════ Notes de musique flottantes ══════ -->
    <g fill="#2D2D2D" opacity="0.15">
      <g transform="translate(400, 800) rotate(-15)">
        <ellipse cx="0" cy="0" rx="30" ry="22"/>
        <rect x="25" y="-80" width="8" height="80"/>
        <path d="M33,-80 Q60,-95 33,-60" fill="none" stroke="#2D2D2D" stroke-width="8" stroke-linecap="round"/>
      </g>
      <g transform="translate(2600, 700) rotate(10)">
        <ellipse cx="0" cy="0" rx="25" ry="18"/>
        <rect x="21" y="-70" width="7" height="70"/>
      </g>
      <g transform="translate(350, 2400) rotate(-5)">
        <ellipse cx="0" cy="0" rx="22" ry="16"/>
        <rect x="18" y="-60" width="6" height="60"/>
      </g>
      <g transform="translate(2650, 2300) rotate(8)">
        <ellipse cx="0" cy="0" rx="28" ry="20"/>
        <rect x="24" y="-75" width="7" height="75"/>
        <path d="M31,-75 Q55,-88 31,-58" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Ondes sonores autour de Papy -->
    <g fill="none" stroke="#F26B5E" stroke-width="6" opacity="0.2">
      <path d="M700,1350 Q650,1450 700,1550" />
      <path d="M650,1300 Q580,1450 650,1600" />
      <path d="M2300,1350 Q2350,1450 2300,1550" />
      <path d="M2350,1300 Q2420,1450 2350,1600" />
    </g>

    <!-- ══════ TEXTE ══════ -->
    <text x="1500" y="350"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="130"
          font-weight="700"
          fill="#FFFFFF"
          stroke="#2D2D2D"
          stroke-width="8"
          paint-order="stroke"
          letter-spacing="5">Les Histoires de</text>

    <text x="1500" y="640"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="380"
          font-weight="800"
          fill="#FFFFFF"
          stroke="#2D2D2D"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(-2, 1500, 640)">Papy</text>

    <!-- Babou intégré dans le cercle en bas -->
    <text x="1500" y="2200"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="250"
          font-weight="800"
          fill="#F26B5E"
          stroke="#2D2D2D"
          stroke-width="10"
          paint-order="stroke"
          letter-spacing="8">Babou</text>

    <!-- Sous-titre -->
    <text x="1500" y="2850"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="75"
          font-weight="600"
          fill="#FFFFFF"
          stroke="#2D2D2D"
          stroke-width="5"
          paint-order="stroke"
          letter-spacing="6">Podcast biblique pour enfants</text>

    <!-- ══════ BORDURE ══════ -->
    <rect x="40" y="40" width="2920" height="2920" rx="130" ry="130"
          fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.5"/>

  </g>
</svg>
