<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <linearGradient id="v3Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A9FE5"/>
      <stop offset="100%" stop-color="#2D7BC4"/>
    </linearGradient>
    <linearGradient id="v3Shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD234"/>
      <stop offset="100%" stop-color="#E8A020"/>
    </linearGradient>
    <clipPath id="v3Clip">
      <rect width="3000" height="3000" rx="140" ry="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v3Clip)">

    <!-- ══════ FOND BLEU ROYAL ══════ -->
    <rect width="3000" height="3000" fill="url(#v3Bg)"/>

    <!-- Motif géométrique subtil -->
    <g opacity="0.06" fill="#FFFFFF">
      <rect x="0" y="0" width="150" height="150" rx="20"/>
      <rect x="300" y="0" width="150" height="150" rx="20"/>
      <rect x="600" y="0" width="150" height="150" rx="20"/>
      <rect x="900" y="0" width="150" height="150" rx="20"/>
      <rect x="1200" y="0" width="150" height="150" rx="20"/>
      <rect x="1500" y="0" width="150" height="150" rx="20"/>
      <rect x="1800" y="0" width="150" height="150" rx="20"/>
      <rect x="2100" y="0" width="150" height="150" rx="20"/>
      <rect x="2400" y="0" width="150" height="150" rx="20"/>
      <rect x="2700" y="0" width="150" height="150" rx="20"/>
      <rect x="150" y="150" width="150" height="150" rx="20"/>
      <rect x="450" y="150" width="150" height="150" rx="20"/>
      <rect x="750" y="150" width="150" height="150" rx="20"/>
      <rect x="1050" y="150" width="150" height="150" rx="20"/>
      <rect x="1350" y="150" width="150" height="150" rx="20"/>
      <rect x="1650" y="150" width="150" height="150" rx="20"/>
      <rect x="1950" y="150" width="150" height="150" rx="20"/>
      <rect x="2250" y="150" width="150" height="150" rx="20"/>
      <rect x="2550" y="150" width="150" height="150" rx="20"/>
      <rect x="2850" y="150" width="150" height="150" rx="20"/>
    </g>

    <!-- ══════ GRAND BOUCLIER/BADGE CENTRAL ══════ -->
    <g transform="translate(1500, 1500)">
      <!-- Ombre du bouclier -->
      <path d="M0,-900 Q550,-870 700,-400 Q750,200 0,900 Q-750,200 -700,-400 Q-550,-870 0,-900Z"
            fill="#1B2A4A" opacity="0.3" transform="translate(15, 15)"/>
      <!-- Bouclier principal -->
      <path d="M0,-900 Q550,-870 700,-400 Q750,200 0,900 Q-750,200 -700,-400 Q-550,-870 0,-900Z"
            fill="url(#v3Shield)" stroke="#C4850A" stroke-width="18"/>
      <!-- Ligne intérieure -->
      <path d="M0,-830 Q500,-800 640,-370 Q685,180 0,830 Q-685,180 -640,-370 Q-500,-800 0,-830Z"
            fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.4"/>

      <!-- ═══ PERSONNAGES DANS LE BOUCLIER ═══ -->

      <!-- Papy Babou (centre haut) -->
      <g transform="translate(0, -200) scale(0.9)">
        <!-- Corps -->
        <ellipse cx="0" cy="160" rx="85" ry="75" fill="#D2B48C" stroke="#2D2D2D" stroke-width="7"/>
        <circle cx="0" cy="140" r="5" fill="#2D2D2D"/>
        <circle cx="0" cy="165" r="5" fill="#2D2D2D"/>
        <!-- Tête -->
        <circle cx="0" cy="-10" r="108" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
        <ellipse cx="-85" cy="-42" rx="38" ry="44" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="5"/>
        <ellipse cx="85" cy="-42" rx="38" ry="44" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="5"/>
        <path d="M-48,-118 Q0,-138 48,-118" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="5"/>
        <!-- Yeux -->
        <ellipse cx="-32" cy="-14" rx="24" ry="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <ellipse cx="32" cy="-14" rx="24" ry="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <circle cx="-27" cy="-12" r="14" fill="#5A7A9A"/>
        <circle cx="37" cy="-12" r="14" fill="#5A7A9A"/>
        <circle cx="-25" cy="-14" r="8" fill="#2D2D2D"/>
        <circle cx="39" cy="-14" r="8" fill="#2D2D2D"/>
        <circle cx="-32" cy="-22" r="5" fill="#FFFFFF"/>
        <circle cx="32" cy="-22" r="5" fill="#FFFFFF"/>
        <!-- Lunettes -->
        <circle cx="-32" cy="-14" r="28" fill="none" stroke="#FFFFFF" stroke-width="7"/>
        <circle cx="32" cy="-14" r="28" fill="none" stroke="#FFFFFF" stroke-width="7"/>
        <line x1="-3" y1="-16" x2="3" y2="-16" stroke="#FFFFFF" stroke-width="5"/>
        <!-- Nez, moustache, sourire -->
        <ellipse cx="0" cy="8" rx="10" ry="8" fill="#E8B88A" stroke="#2D2D2D" stroke-width="3"/>
        <path d="M-28,20 Q-14,30 0,24 Q14,30 28,20" fill="#C0C0C0" stroke="#2D2D2D" stroke-width="4"/>
        <path d="M-24,36 Q0,55 24,36" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
        <circle cx="-60" cy="10" r="15" fill="#F26B5E" opacity="0.3"/>
        <circle cx="60" cy="10" r="15" fill="#F26B5E" opacity="0.3"/>
        <!-- Bras héroïques -->
        <path d="M-85,130 Q-140,80 -160,30" fill="none" stroke="#D2B48C" stroke-width="35" stroke-linecap="round"/>
        <circle cx="-160" cy="30" r="16" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
        <path d="M85,130 Q140,80 160,30" fill="none" stroke="#D2B48C" stroke-width="35" stroke-linecap="round"/>
        <circle cx="160" cy="30" r="16" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
      </g>

      <!-- Antoine (gauche bas) -->
      <g transform="translate(-300, 350) scale(0.65)">
        <ellipse cx="0" cy="120" rx="65" ry="60" fill="#4A9FE5" stroke="#2D2D2D" stroke-width="7"/>
        <circle cx="0" cy="-10" r="90" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
        <path d="M-75,-28 Q-80,-85 -48,-98 Q-20,-112 0,-106 Q20,-112 48,-98 Q80,-82 75,-28" fill="#8B6914" stroke="#2D2D2D" stroke-width="6"/>
        <ellipse cx="-24" cy="-5" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <ellipse cx="24" cy="-5" rx="20" ry="22" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <circle cx="-19" cy="-3" r="12" fill="#2D5B9E"/>
        <circle cx="29" cy="-3" r="12" fill="#2D5B9E"/>
        <circle cx="-17" cy="-5" r="7" fill="#2D2D2D"/>
        <circle cx="31" cy="-5" r="7" fill="#2D2D2D"/>
        <circle cx="-24" cy="-13" r="4.5" fill="#FFFFFF"/>
        <circle cx="24" cy="-13" r="4.5" fill="#FFFFFF"/>
        <path d="M-20,28 Q0,44 20,28" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
        <circle cx="-46" cy="14" r="12" fill="#F26B5E" opacity="0.35"/>
        <circle cx="46" cy="14" r="12" fill="#F26B5E" opacity="0.35"/>
      </g>

      <!-- Noémie (droite bas) -->
      <g transform="translate(300, 360) scale(0.6)">
        <ellipse cx="0" cy="110" rx="60" ry="55" fill="#E895A8" stroke="#2D2D2D" stroke-width="7"/>
        <circle cx="0" cy="-15" r="82" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
        <path d="M-68,-25 Q-72,-78 -42,-90 Q-18,-104 0,-98 Q18,-104 42,-90 Q72,-76 68,-25" fill="#FFD234" stroke="#2D2D2D" stroke-width="6"/>
        <circle cx="-68" cy="-42" r="15" fill="#FFD234" stroke="#2D2D2D" stroke-width="4"/>
        <circle cx="68" cy="-42" r="15" fill="#FFD234" stroke="#2D2D2D" stroke-width="4"/>
        <path d="M8,-92 Q16,-106 24,-92" fill="#F26B5E" stroke="#2D2D2D" stroke-width="3"/>
        <path d="M8,-92 Q16,-78 24,-92" fill="#F26B5E" stroke="#2D2D2D" stroke-width="3"/>
        <circle cx="16" cy="-92" r="4.5" fill="#D4486B"/>
        <ellipse cx="-20" cy="-7" rx="18" ry="20" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <ellipse cx="20" cy="-7" rx="18" ry="20" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
        <circle cx="-24" cy="-5" r="11" fill="#4A9FE5"/>
        <circle cx="16" cy="-5" r="11" fill="#4A9FE5"/>
        <circle cx="-25" cy="-7" r="6" fill="#2D2D2D"/>
        <circle cx="15" cy="-7" r="6" fill="#2D2D2D"/>
        <circle cx="-20" cy="-14" r="4" fill="#FFFFFF"/>
        <circle cx="20" cy="-14" r="4" fill="#FFFFFF"/>
        <path d="M-18,22 Q0,36 18,22" fill="none" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
        <circle cx="-42" cy="12" r="12" fill="#F26B5E" opacity="0.4"/>
        <circle cx="42" cy="12" r="12" fill="#F26B5E" opacity="0.4"/>
      </g>

      <!-- Croix dorée en haut du bouclier -->
      <g transform="translate(0, -740)">
        <rect x="-12" y="-45" width="24" height="90" rx="6" fill="#FFFFFF" opacity="0.8"/>
        <rect x="-35" y="-18" width="70" height="24" rx="6" fill="#FFFFFF" opacity="0.8"/>
      </g>
    </g>

    <!-- ══════ TEXTE ══════ -->
    <!-- Bannière en haut -->
    <text x="1500" y="250"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="130"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="8"
          opacity="0.95">LES HISTOIRES DE</text>

    <!-- Bannière ruban derrière le bouclier (bas) -->
    <g transform="translate(1500, 2650)">
      <!-- Ruban -->
      <path d="M-600,0 Q-550,-40 -500,0 L500,0 Q550,-40 600,0 L580,60 Q550,30 500,60 L-500,60 Q-550,30 -580,60Z" fill="#F26B5E" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M-600,0 L-680,30 L-600,60Z" fill="#D4486B" stroke="#2D2D2D" stroke-width="5"/>
      <path d="M600,0 L680,30 L600,60Z" fill="#D4486B" stroke="#2D2D2D" stroke-width="5"/>
      <text x="0" y="45"
            text-anchor="middle"
            font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
            font-size="55"
            font-weight="700"
            fill="#FFFFFF"
            letter-spacing="5">PODCAST BIBLIQUE POUR ENFANTS</text>
    </g>

    <!-- Nom en gros -->
    <text x="1500" y="2520"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="260"
          font-weight="800"
          fill="#FFFFFF"
          stroke="#2D7BC4"
          stroke-width="10"
          paint-order="stroke"
          letter-spacing="8">PAPY BABOU</text>

    <!-- Étoiles décoratives -->
    <g fill="#FFD234" stroke="#C4850A" stroke-width="3">
      <polygon points="300,350 315,395 365,395 325,422 340,468 300,442 260,468 275,422 235,395 285,395"/>
      <polygon points="2700,350 2715,395 2765,395 2725,422 2740,468 2700,442 2660,468 2675,422 2635,395 2685,395"/>
      <polygon points="200,2450 212,485 255,485 220,508 233,550 200,527 167,550 180,508 145,485 188,485" transform="translate(0, 2000) scale(0.8)"/>
      <polygon points="2800,2450 2812,485 2855,485 2820,508 2833,550 2800,527 2767,550 2780,508 2745,485 2788,485" transform="translate(0, 2000) scale(0.8)"/>
    </g>

    <!-- ══════ BORDURE ══════ -->
    <rect x="40" y="40" width="2920" height="2920" rx="130" ry="130"
          fill="none" stroke="#FFD234" stroke-width="12" opacity="0.6"/>

  </g>
</svg>
