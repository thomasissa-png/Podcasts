    <!-- Joues -->
    <ellipse cx="-38" cy="8" rx="12" ry="8" fill="#F0988C" opacity="0.3"/>
    <ellipse cx="38" cy="8" rx="12" ry="8" fill="#F0988C" opacity="0.3"/>
