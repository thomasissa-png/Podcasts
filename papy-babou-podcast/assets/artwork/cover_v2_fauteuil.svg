    <!-- Feu cheminée -->
    <radialGradient id="fireGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
    </radialGradient>
    <!-- Enfant peau -->
    <radialGradient id="childSkin" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE0C0"/>
      <stop offset="80%" stop-color="#F5D0A5"/>
      <stop offset="100%" stop-color="#E8C090"/>
    </radialGradient>
