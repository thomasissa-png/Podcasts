    <circle cx="-16" cy="-2" r="8" fill="#4A7A4A"/>
    <circle cx="-14" cy="-4" r="4.5" fill="#2A4A2A"/>
    <circle cx="-20" cy="-8" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="20" cy="-5" rx="13" ry="15" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
    <circle cx="24" cy="-2" r="8" fill="#4A7A4A"/>
    <circle cx="26" cy="-4" r="4.5" fill="#2A4A2A"/>
