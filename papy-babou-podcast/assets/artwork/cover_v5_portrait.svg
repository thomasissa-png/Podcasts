<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <radialGradient id="skinFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="80%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E0B080"/>
    </radialGradient>
    <radialGradient id="skinHand" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2C3E6B"/>
      <stop offset="100%" stop-color="#1A2744"/>
    </linearGradient>
    <radialGradient id="hairGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E8E4DE"/>
      <stop offset="100%" stop-color="#C0B8AC"/>
    </radialGradient>
    <radialGradient id="scalpGrad" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FCDEC0"/>
      <stop offset="60%" stop-color="#F0C9A0"/>
      <stop offset="100%" stop-color="#E8BC95"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7AA0C4"/>
      <stop offset="60%" stop-color="#4A7A9F"/>
      <stop offset="100%" stop-color="#3A6080"/>
    </radialGradient>
    <!-- Fond doux -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="100%" stop-color="#F0E0C0"/>
    </radialGradient>
    <!-- Cadre doré -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DAA520"/>
      <stop offset="30%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="70%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="3000" height="3000" fill="url(#bgGrad)"/>

  <!-- Motif décoratif subtil -->
  <g opacity="0.04">
    <circle cx="300" cy="300" r="200" fill="none" stroke="#B8860B" stroke-width="3"/>
    <circle cx="2700" cy="300" r="200" fill="none" stroke="#B8860B" stroke-width="3"/>
    <circle cx="300" cy="2700" r="200" fill="none" stroke="#B8860B" stroke-width="3"/>
    <circle cx="2700" cy="2700" r="200" fill="none" stroke="#B8860B" stroke-width="3"/>
    <circle cx="1500" cy="1500" r="800" fill="none" stroke="#B8860B" stroke-width="2"/>
    <circle cx="1500" cy="1500" r="900" fill="none" stroke="#B8860B" stroke-width="2"/>
  </g>

  <!-- Cadre doré ornementé -->
  <rect x="120" y="120" width="2760" height="2760" rx="40" fill="none" stroke="url(#frameGrad)" stroke-width="50"/>
  <rect x="180" y="180" width="2640" height="2640" rx="30" fill="none" stroke="#B8860B" stroke-width="4"/>
  <!-- Coins décoratifs -->
  <g opacity="0.6">
    <!-- Coin HG -->
    <path d="M200,300 Q200,200 300,200" fill="none" stroke="#FFD700" stroke-width="8"/>
    <path d="M220,340 Q220,220 340,220" fill="none" stroke="#FFD700" stroke-width="5"/>
    <!-- Coin HD -->
    <path d="M2700,200 Q2800,200 2800,300" fill="none" stroke="#FFD700" stroke-width="8"/>
    <path d="M2660,220 Q2780,220 2780,340" fill="none" stroke="#FFD700" stroke-width="5"/>
    <!-- Coin BG -->
    <path d="M200,2700 Q200,2800 300,2800" fill="none" stroke="#FFD700" stroke-width="8"/>
    <path d="M220,2660 Q220,2780 340,2780" fill="none" stroke="#FFD700" stroke-width="5"/>
    <!-- Coin BD -->
    <path d="M2800,2700 Q2800,2800 2700,2800" fill="none" stroke="#FFD700" stroke-width="8"/>
    <path d="M2780,2660 Q2780,2780 2660,2780" fill="none" stroke="#FFD700" stroke-width="5"/>
  </g>

  <!-- ═══ PAPY BABOU — portrait en gros plan ═══ -->
  <g transform="translate(1500, 1150)">

    <!-- Corps / Épaules (visible en bas du portrait) -->
    <path d="M-350,420 Q-370,500 -350,620 L350,620 Q370,500 350,420Z" fill="url(#shirtGrad)" stroke="#152040" stroke-width="4"/>
    <path d="M-350,420 Q-370,500 -350,620 L-100,620 Q-120,500 -110,420Z" fill="#152040" opacity="0.25"/>
    <!-- Col -->
    <path d="M-130,410 L-55,465 L0,445 L55,465 L130,410 Q70,385 0,388 Q-70,385 -130,410Z" fill="#344E7A" stroke="#2C3E6B" stroke-width="3"/>
    <!-- Boutons -->
    <circle cx="0" cy="520" r="10" fill="#8A9AB8" stroke="#6A7A98" stroke-width="2"/>
    <circle cx="0" cy="580" r="10" fill="#8A9AB8" stroke="#6A7A98" stroke-width="2"/>

    <!-- Cou -->
    <rect x="-75" y="360" width="150" height="80" rx="25" fill="url(#skinFace)"/>

    <!-- ══ TETE (très grande pour le portrait) ══ -->
    <path d="M-340,-20 Q-355,-155 -295,-275 Q-210,-385 0,-398 Q210,-385 295,-275 Q355,-155 340,-20 Q332,120 270,195 Q185,290 0,310 Q-185,290 -270,195 Q-332,120 -340,-20Z"
          fill="url(#skinFace)" stroke="#D4A06A" stroke-width="4"/>

    <!-- Crâne chauve -->
    <path d="M-285,-55 Q-300,-215 -205,-320 Q-110,-390 0,-398 Q110,-390 205,-320 Q300,-215 285,-55"
          fill="url(#scalpGrad)" stroke="#D4A06A" stroke-width="1.5"/>
    <ellipse cx="-25" cy="-305" rx="100" ry="42" fill="#FFFFFF" opacity="0.12"/>

    <!-- Cheveux côtés -->
    <path d="M-348,-30 Q-378,-65 -370,-148 Q-355,-192 -328,-178 Q-305,-162 -338,-82 Q-345,-25 -348,-30Z"
          fill="url(#hairGrad)" stroke="#B0A898" stroke-width="3"/>
    <ellipse cx="-340" cy="8" rx="52" ry="88" fill="url(#hairGrad)" stroke="#B0A898" stroke-width="3"/>
    <path d="M348,-30 Q378,-65 370,-148 Q355,-192 328,-178 Q305,-162 338,-82 Q345,-25 348,-30Z"
          fill="url(#hairGrad)" stroke="#B0A898" stroke-width="3"/>
    <ellipse cx="340" cy="8" rx="52" ry="88" fill="url(#hairGrad)" stroke="#B0A898" stroke-width="3"/>

    <!-- Oreilles -->
    <ellipse cx="-345" cy="30" rx="42" ry="62" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="4"/>
    <ellipse cx="-345" cy="30" rx="25" ry="40" fill="#F0C0A0" opacity="0.4"/>
    <ellipse cx="345" cy="30" rx="42" ry="62" fill="url(#skinFace)" stroke="#D4A06A" stroke-width="4"/>
    <ellipse cx="345" cy="30" rx="25" ry="40" fill="#F0C0A0" opacity="0.4"/>

    <!-- Yeux (grands, expressifs, regard bienveillant) -->
    <ellipse cx="-115" cy="18" rx="72" ry="78" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
    <circle cx="-100" cy="28" r="45" fill="url(#irisGrad)"/>
    <circle cx="-95" cy="22" r="25" fill="#1A1A2E"/>
    <circle cx="-115" cy="2" r="16" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-85" cy="32" r="10" fill="#FFFFFF" opacity="0.5"/>
    <path d="M-187,8 Q-115,-30 -43,4" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>

    <ellipse cx="115" cy="18" rx="72" ry="78" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="5"/>
    <circle cx="130" cy="28" r="45" fill="url(#irisGrad)"/>
    <circle cx="135" cy="22" r="25" fill="#1A1A2E"/>
    <circle cx="115" cy="2" r="16" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="145" cy="32" r="10" fill="#FFFFFF" opacity="0.5"/>
    <path d="M43,4 Q115,-30 187,8" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>

    <!-- Sourcils (arc bienveillant) -->
    <path d="M-182,-28 Q-115,-62 -45,-35" fill="none" stroke="#8A8078" stroke-width="12" stroke-linecap="round"/>
    <path d="M45,-35 Q115,-62 182,-28" fill="none" stroke="#8A8078" stroke-width="12" stroke-linecap="round"/>

    <!-- Lunettes rectangulaires foncées -->
    <rect x="-198" y="-25" width="170" height="95" rx="18" fill="none" stroke="#2A2A2A" stroke-width="12"/>
    <rect x="28" y="-25" width="170" height="95" rx="18" fill="none" stroke="#2A2A2A" stroke-width="12"/>
    <path d="M-28,22 Q0,10 28,22" fill="none" stroke="#2A2A2A" stroke-width="9"/>
    <line x1="-198" y1="8" x2="-325" y2="-18" stroke="#2A2A2A" stroke-width="9" stroke-linecap="round"/>
    <line x1="198" y1="8" x2="325" y2="-18" stroke="#2A2A2A" stroke-width="9" stroke-linecap="round"/>
    <!-- Reflets -->
    <path d="M-168,-8 Q-140,-22 -100,-12" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.2" stroke-linecap="round"/>
    <path d="M58,-8 Q86,-22 126,-12" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.2" stroke-linecap="round"/>

    <!-- Nez -->
    <path d="M-12,80 Q0,125 12,80" fill="#E8B88A" stroke="#D4A06A" stroke-width="3"/>
    <ellipse cx="0" cy="110" rx="25" ry="16" fill="#E8B88A"/>

    <!-- Bouche (grand sourire chaleureux) -->
    <path d="M-75,152 Q0,210 75,152" fill="#C43A2F" stroke="#2D2D2D" stroke-width="5"/>
    <path d="M-58,158 Q0,192 58,158" fill="#FFFFFF" opacity="0.5"/>

    <!-- Joues roses -->
    <ellipse cx="-205" cy="98" rx="55" ry="38" fill="#F0988C" opacity="0.3"/>
    <ellipse cx="205" cy="98" rx="55" ry="38" fill="#F0988C" opacity="0.3"/>

    <!-- Rides sourire -->
    <path d="M-218,72 Q-212,112 -205,138" fill="none" stroke="#D4A06A" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
    <path d="M218,72 Q212,112 205,138" fill="none" stroke="#D4A06A" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- ═══ TITRE ═══ -->
  <!-- Bannière élégante -->
  <rect x="300" y="2100" width="2400" height="320" rx="20" fill="#1A2744" opacity="0.88"/>
  <text x="1500" y="2230" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" fill="#FFFFFF" letter-spacing="4">
    Les Histoires de
  </text>
  <text x="1500" y="2380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="170" font-weight="bold" fill="#FFD700" letter-spacing="3">
    Papy Babou
  </text>

  <!-- Sous-titre -->
  <text x="1500" y="2520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="65" fill="#B8860B" letter-spacing="12">
    HISTOIRES BIBLIQUES POUR LES ENFANTS
  </text>
</svg>
