<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <clipPath id="c1"><rect width="3000" height="3000" rx="100" ry="100"/></clipPath>
  </defs>
  <g clip-path="url(#c1)">

    <!-- Fond doux crème -->
    <rect width="3000" height="3000" fill="#FFF3E0"/>

    <!-- Ciel bleu pastel arrondi -->
    <ellipse cx="1500" cy="-200" rx="2200" ry="1800" fill="#B3DAF1"/>

    <!-- Collines douces -->
    <ellipse cx="800" cy="2400" rx="1000" ry="400" fill="#A8D5A2"/>
    <ellipse cx="2200" cy="2500" rx="1200" ry="350" fill="#8CC084"/>
    <ellipse cx="1500" cy="2600" rx="1800" ry="400" fill="#C8B47A"/>

    <!-- Sol sable -->
    <rect x="0" y="2500" width="3000" height="500" fill="#E8D5A8"/>

    <!-- Petits nuages simples (ellipses blanches) -->
    <ellipse cx="500" cy="500" rx="130" ry="45" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="440" cy="490" rx="80" ry="35" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="2400" cy="400" rx="150" ry="50" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="2330" cy="390" rx="90" ry="38" fill="#FFFFFF" opacity="0.7"/>

    <!-- ═══ PAPY BABOU (centre) — style Quelle Histoire ═══ -->
    <g transform="translate(1500, 1650)">
      <!-- Ombre au sol -->
      <ellipse cx="0" cy="340" rx="100" ry="20" fill="#D4C090" opacity="0.5"/>

      <!-- Jambes (petits rectangles arrondis) -->
      <rect x="-40" y="230" width="30" height="80" rx="15" fill="#3A5E8C"/>
      <rect x="10" y="230" width="30" height="80" rx="15" fill="#3A5E8C"/>
      <!-- Chaussures (petits ovales) -->
      <ellipse cx="-25" cy="315" rx="22" ry="12" fill="#8B6A3E"/>
      <ellipse cx="25" cy="315" rx="22" ry="12" fill="#8B6A3E"/>

      <!-- Corps (rectangle arrondi simple) -->
      <rect x="-55" y="130" width="110" height="110" rx="30" fill="#C49A6C"/>

      <!-- Chemise col (petit trapèze) -->
      <rect x="-25" y="125" width="50" height="25" rx="8" fill="#F5ECD5"/>

      <!-- Boutons -->
      <circle cx="0" cy="170" r="5" fill="#8B6A3E"/>
      <circle cx="0" cy="195" r="5" fill="#8B6A3E"/>

      <!-- Bras gauche (levé, pointant) -->
      <rect x="-100" y="80" width="55" height="22" rx="11" fill="#F2C9A0" transform="rotate(-50, -55, 150)"/>
      <!-- Main gauche -->
      <circle cx="-110" cy="50" r="16" fill="#F2C9A0"/>
      <!-- Index pointé vers le haut -->
      <rect x="-114" y="15" width="8" height="28" rx="4" fill="#F2C9A0"/>

      <!-- Bras droit (le long du corps) -->
      <rect x="50" y="145" width="50" height="20" rx="10" fill="#F2C9A0" transform="rotate(15, 55, 155)"/>
      <circle cx="100" cy="170" r="16" fill="#F2C9A0"/>

      <!-- ══ TETE (grosse, ronde, style figurine) ══ -->
      <circle cx="0" cy="30" r="120" fill="#F2C9A0"/>

      <!-- Cheveux blancs/gris — calotte simple -->
      <path d="M-90,10 Q-100,-60 -70,-90 Q-30,-120 0,-115 Q30,-120 70,-90 Q100,-60 90,10" fill="#E0DDD5"/>
      <!-- Touffes sur les côtés -->
      <ellipse cx="-95" cy="-10" rx="30" ry="40" fill="#E0DDD5"/>
      <ellipse cx="95" cy="-10" rx="30" ry="40" fill="#E0DDD5"/>

      <!-- Oreilles -->
      <circle cx="-115" cy="30" r="18" fill="#F2C9A0"/>
      <circle cx="115" cy="30" r="18" fill="#F2C9A0"/>

      <!-- Yeux — petits points noirs (style Quelle Histoire) -->
      <circle cx="-30" cy="15" r="8" fill="#2D2D2D"/>
      <circle cx="30" cy="15" r="8" fill="#2D2D2D"/>
      <!-- Reflets -->
      <circle cx="-27" cy="12" r="3" fill="#FFFFFF"/>
      <circle cx="33" cy="12" r="3" fill="#FFFFFF"/>

      <!-- Lunettes rondes (fines) -->
      <circle cx="-30" cy="15" r="22" fill="none" stroke="#D4A840" stroke-width="4"/>
      <circle cx="30" cy="15" r="22" fill="none" stroke="#D4A840" stroke-width="4"/>
      <line x1="-8" y1="15" x2="8" y2="15" stroke="#D4A840" stroke-width="3"/>

      <!-- Nez (petit triangle arrondi) -->
      <ellipse cx="0" cy="38" rx="8" ry="6" fill="#E5B88A"/>

      <!-- Moustache (forme simple) -->
      <path d="M-22,50 Q0,62 22,50" fill="#C8C4BC" stroke="none"/>

      <!-- Sourire (arc simple) -->
      <path d="M-18,58 Q0,72 18,58" fill="none" stroke="#2D2D2D" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Joues roses (cercles doux) -->
      <circle cx="-55" cy="40" r="18" fill="#F0988C" opacity="0.35"/>
      <circle cx="55" cy="40" r="18" fill="#F0988C" opacity="0.35"/>
    </g>

    <!-- ═══ ANTOINE (gauche) — style figurine ═══ -->
    <g transform="translate(750, 1850)">
      <ellipse cx="0" cy="275" rx="70" ry="14" fill="#D4C090" opacity="0.4"/>

      <!-- Jambes -->
      <rect x="-28" y="190" width="22" height="60" rx="11" fill="#3A5E8C"/>
      <rect x="6" y="190" width="22" height="60" rx="11" fill="#3A5E8C"/>
      <ellipse cx="-17" cy="255" rx="18" ry="10" fill="#E06050"/>
      <ellipse cx="17" cy="255" rx="18" ry="10" fill="#E06050"/>

      <!-- Corps (t-shirt bleu) -->
      <rect x="-42" y="105" width="84" height="90" rx="25" fill="#5A9FD4"/>

      <!-- Bras droit tendu (dynamique) -->
      <rect x="40" y="100" width="50" height="18" rx="9" fill="#F2C9A0" transform="rotate(-30, 42, 115)"/>
      <circle cx="88" cy="82" r="14" fill="#F2C9A0"/>

      <!-- Bras gauche -->
      <rect x="-85" y="120" width="48" height="18" rx="9" fill="#F2C9A0" transform="rotate(10, -42, 130)"/>
      <circle cx="-82" cy="138" r="14" fill="#F2C9A0"/>

      <!-- Tête -->
      <circle cx="0" cy="20" r="95" fill="#F2C9A0"/>

      <!-- Cheveux bruns — calotte -->
      <path d="M-72,0 Q-78,-50 -52,-72 Q-25,-90 0,-88 Q25,-90 52,-72 Q78,-50 72,0" fill="#8B6A3E"/>
      <!-- Mèche rebelle -->
      <path d="M-5,-88 Q-2,-110 8,-105 Q5,-95 2,-88" fill="#8B6A3E"/>

      <!-- Yeux (gros pour un enfant — style QH) -->
      <circle cx="-22" cy="8" r="7" fill="#2D2D2D"/>
      <circle cx="22" cy="8" r="7" fill="#2D2D2D"/>
      <circle cx="-19" cy="5" r="2.5" fill="#FFFFFF"/>
      <circle cx="25" cy="5" r="2.5" fill="#FFFFFF"/>

      <!-- Taches de rousseur -->
      <circle cx="-35" cy="22" r="3" fill="#D4A06A" opacity="0.5"/>
      <circle cx="-28" cy="28" r="2.5" fill="#D4A06A" opacity="0.4"/>
      <circle cx="35" cy="22" r="3" fill="#D4A06A" opacity="0.5"/>
      <circle cx="28" cy="28" r="2.5" fill="#D4A06A" opacity="0.4"/>

      <!-- Nez -->
      <ellipse cx="0" cy="28" rx="5" ry="4" fill="#E5B88A"/>

      <!-- Bouche ouverte (wow !) -->
      <ellipse cx="0" cy="42" rx="12" ry="10" fill="#2D2D2D"/>
      <ellipse cx="0" cy="38" rx="8" ry="4" fill="#FFFFFF" opacity="0.3"/>

      <!-- Joues -->
      <circle cx="-42" cy="30" r="14" fill="#F0988C" opacity="0.35"/>
      <circle cx="42" cy="30" r="14" fill="#F0988C" opacity="0.35"/>
    </g>

    <!-- ═══ NOEMIE (droite) — style figurine ═══ -->
    <g transform="translate(2250, 1880)">
      <ellipse cx="0" cy="245" rx="65" ry="12" fill="#D4C090" opacity="0.4"/>

      <!-- Jambes -->
      <rect x="-25" y="170" width="20" height="55" rx="10" fill="#F5ECD5"/>
      <rect x="5" y="170" width="20" height="55" rx="10" fill="#F5ECD5"/>
      <ellipse cx="-15" cy="228" rx="16" ry="9" fill="#E895A8"/>
      <ellipse cx="15" cy="228" rx="16" ry="9" fill="#E895A8"/>

      <!-- Corps (robe rose) -->
      <rect x="-38" y="90" width="76" height="85" rx="22" fill="#E895A8"/>
      <!-- Petite fleur sur la robe -->
      <circle cx="-10" cy="120" r="5" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="12" cy="140" r="4" fill="#FFFFFF" opacity="0.4"/>

      <!-- Bras gauche (tient le doudou) -->
      <rect x="-78" y="105" width="44" height="16" rx="8" fill="#F2C9A0" transform="rotate(15, -38, 115)"/>
      <circle cx="-76" cy="125" r="12" fill="#F2C9A0"/>

      <!-- Doudou lapin (très simplifié) -->
      <g transform="translate(-88, 118)">
        <ellipse cx="0" cy="10" rx="12" ry="15" fill="#FFFFFF"/>
        <circle cx="0" cy="-5" r="10" fill="#FFFFFF"/>
        <ellipse cx="-5" cy="-16" rx="3.5" ry="10" fill="#FFFFFF"/>
        <ellipse cx="5" cy="-16" rx="3.5" ry="10" fill="#FFFFFF"/>
        <ellipse cx="-5" cy="-16" rx="2" ry="7" fill="#F0B0C0" opacity="0.5"/>
        <ellipse cx="5" cy="-16" rx="2" ry="7" fill="#F0B0C0" opacity="0.5"/>
        <circle cx="-3" cy="-6" r="2" fill="#2D2D2D"/>
        <circle cx="3" cy="-6" r="2" fill="#2D2D2D"/>
      </g>

      <!-- Bras droit (levé, salut) -->
      <rect x="35" y="80" width="44" height="16" rx="8" fill="#F2C9A0" transform="rotate(-40, 38, 100)"/>
      <circle cx="72" cy="62" r="12" fill="#F2C9A0"/>

      <!-- Tête -->
      <circle cx="0" cy="12" r="85" fill="#F2C9A0"/>

      <!-- Cheveux blonds — calotte + boucles -->
      <path d="M-66,-5 Q-70,-48 -42,-65 Q-18,-80 0,-76 Q18,-80 42,-65 Q70,-48 66,-5" fill="#F0C850"/>
      <circle cx="-66" cy="-15" r="18" fill="#F0C850"/>
      <circle cx="66" cy="-15" r="18" fill="#F0C850"/>
      <circle cx="-58" cy="5" r="12" fill="#F0C850"/>
      <circle cx="58" cy="5" r="12" fill="#F0C850"/>

      <!-- Noeud rose -->
      <g transform="translate(15, -72)">
        <ellipse cx="-12" cy="0" rx="12" ry="8" fill="#E06050"/>
        <ellipse cx="12" cy="0" rx="12" ry="8" fill="#E06050"/>
        <circle cx="0" cy="0" r="5" fill="#C43A2F"/>
      </g>

      <!-- Yeux -->
      <circle cx="-20" cy="2" r="6.5" fill="#2D2D2D"/>
      <circle cx="20" cy="2" r="6.5" fill="#2D2D2D"/>
      <circle cx="-17" cy="0" r="2.5" fill="#FFFFFF"/>
      <circle cx="23" cy="0" r="2.5" fill="#FFFFFF"/>

      <!-- Cils (petits traits) -->
      <line x1="-28" y1="-4" x2="-30" y2="-8" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
      <line x1="28" y1="-4" x2="30" y2="-8" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>

      <!-- Nez -->
      <ellipse cx="0" cy="22" rx="4.5" ry="3.5" fill="#E5B88A"/>

      <!-- Sourire chipie -->
      <path d="M-14,34 Q0,46 14,34" fill="none" stroke="#2D2D2D" stroke-width="3" stroke-linecap="round"/>

      <!-- Joues -->
      <circle cx="-38" cy="25" r="13" fill="#F0988C" opacity="0.4"/>
      <circle cx="38" cy="25" r="13" fill="#F0988C" opacity="0.4"/>
    </g>

    <!-- ═══ Livre ouvert (devant Papy, au sol) ═══ -->
    <g transform="translate(1500, 2350)">
      <rect x="-110" y="-30" width="100" height="65" rx="5" fill="#FDF5E6" transform="rotate(5, -60, 0)"/>
      <rect x="10" y="-30" width="100" height="65" rx="5" fill="#FDF5E6" transform="rotate(-5, 60, 0)"/>
      <rect x="-8" y="-32" width="16" height="68" rx="3" fill="#C49A6C"/>
      <!-- Lignes de texte -->
      <g opacity="0.12" fill="#2D2D2D">
        <rect x="-90" y="-15" width="60" height="4" rx="2" transform="rotate(5, -60, 0)"/>
        <rect x="-90" y="-3" width="70" height="4" rx="2" transform="rotate(5, -60, 0)"/>
        <rect x="-90" y="9" width="50" height="4" rx="2" transform="rotate(5, -60, 0)"/>
        <rect x="25" y="-15" width="65" height="4" rx="2" transform="rotate(-5, 60, 0)"/>
        <rect x="25" y="-3" width="55" height="4" rx="2" transform="rotate(-5, 60, 0)"/>
        <rect x="25" y="9" width="70" height="4" rx="2" transform="rotate(-5, 60, 0)"/>
      </g>
      <!-- Étoiles sortant du livre -->
      <g fill="#F0C850" opacity="0.6">
        <polygon points="0,-60 5,-48 18,-48 8,-40 12,-28 0,-36 -12,-28 -8,-40 -18,-48 -5,-48" transform="scale(0.8)"/>
        <polygon points="-50,-80 -46,-70 -36,-70 -44,-64 -40,-54 -50,-60 -60,-54 -56,-64 -64,-70 -54,-70" transform="scale(0.6)"/>
        <polygon points="55,-75 59,-65 69,-65 61,-59 65,-49 55,-55 45,-49 49,-59 41,-65 51,-65" transform="scale(0.6)"/>
      </g>
    </g>

    <!-- ═══ TEXTE — style Quelle Histoire (simple, élégant) ═══ -->

    <!-- Bandeau titre en haut -->
    <rect x="300" y="250" width="2400" height="450" rx="30" fill="#E06050" opacity="0.9"/>

    <text x="1500" y="410"
          text-anchor="middle"
          font-family="'Nunito', 'Baloo 2', sans-serif"
          font-size="100"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="6"
          opacity="0.9">LES HISTOIRES DE</text>

    <text x="1500" y="610"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', cursive"
          font-size="260"
          font-weight="800"
          fill="#FFFFFF"
          letter-spacing="8">Papy Babou</text>

    <!-- Sous-titre en bas -->
    <rect x="700" y="2700" width="1600" height="80" rx="40" fill="#5A9FD4" opacity="0.85"/>
    <text x="1500" y="2758"
          text-anchor="middle"
          font-family="'Nunito', sans-serif"
          font-size="48"
          font-weight="700"
          fill="#FFFFFF"
          letter-spacing="4">PODCAST BIBLIQUE POUR ENFANTS</text>

  </g>
</svg>
