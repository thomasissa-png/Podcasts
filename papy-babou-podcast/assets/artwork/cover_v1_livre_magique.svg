<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <defs>
    <linearGradient id="v1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="40%" stop-color="#2D4A7A"/>
      <stop offset="100%" stop-color="#4A9FE5"/>
    </linearGradient>
    <radialGradient id="v1BookGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFD234" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFD234" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD234" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v1StarGlow" cx="50%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="v1Clip">
      <rect width="3000" height="3000" rx="140" ry="140"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v1Clip)">

    <!-- ══════ CIEL NUIT ETOILEE ══════ -->
    <rect width="3000" height="3000" fill="url(#v1Sky)"/>
    <rect width="3000" height="3000" fill="url(#v1StarGlow)"/>

    <!-- Étoiles scintillantes -->
    <g fill="#FFFFFF">
      <circle cx="200" cy="150" r="3" opacity="0.8"/>
      <circle cx="500" cy="100" r="2" opacity="0.6"/>
      <circle cx="800" cy="200" r="4" opacity="0.9"/>
      <circle cx="1100" cy="80" r="2.5" opacity="0.5"/>
      <circle cx="1400" cy="180" r="3" opacity="0.7"/>
      <circle cx="1700" cy="120" r="2" opacity="0.6"/>
      <circle cx="2000" cy="160" r="3.5" opacity="0.8"/>
      <circle cx="2300" cy="90" r="2" opacity="0.5"/>
      <circle cx="2600" cy="200" r="3" opacity="0.7"/>
      <circle cx="2800" cy="140" r="2.5" opacity="0.6"/>
      <circle cx="350" cy="350" r="2" opacity="0.4"/>
      <circle cx="650" cy="400" r="3" opacity="0.6"/>
      <circle cx="950" cy="300" r="2" opacity="0.5"/>
      <circle cx="1250" cy="380" r="2.5" opacity="0.4"/>
      <circle cx="2150" cy="350" r="3" opacity="0.5"/>
      <circle cx="2450" cy="400" r="2" opacity="0.4"/>
      <circle cx="2750" cy="320" r="2.5" opacity="0.6"/>
    </g>
    <!-- Étoiles 4 branches -->
    <g fill="#FFD234" opacity="0.7">
      <path d="M300,250 L305,240 L310,250 L305,260Z"/>
      <path d="M2700,180 L2705,168 L2710,180 L2705,192Z" transform="scale(1.5) translate(-900,-60)"/>
    </g>

    <!-- ══════ GRAND LIVRE OUVERT — source de lumière ══════ -->
    <rect width="3000" height="3000" fill="url(#v1BookGlow)"/>

    <g transform="translate(1500, 1650)">
      <!-- Livre ouvert géant avec pages dorées -->
      <path d="M-500,-100 Q-500,-180 -420,-180 L-40,-180 L-40,180 L-500,180 Q-530,180 -530,150Z" fill="#FDF5E6" stroke="#8B6914" stroke-width="10"/>
      <path d="M500,-100 Q500,-180 420,-180 L40,-180 L40,180 L500,180 Q530,180 530,150Z" fill="#FDF5E6" stroke="#8B6914" stroke-width="10"/>
      <!-- Reliure -->
      <rect x="-40" y="-180" width="80" height="360" rx="8" fill="#C4850A" stroke="#8B6914" stroke-width="10"/>

      <!-- Lignes de texte (subtiles) -->
      <g opacity="0.15" fill="#2D2D2D">
        <rect x="-440" y="-130" width="300" height="8" rx="4"/>
        <rect x="-440" y="-100" width="350" height="8" rx="4"/>
        <rect x="-440" y="-70" width="280" height="8" rx="4"/>
        <rect x="-440" y="-40" width="330" height="8" rx="4"/>
        <rect x="-440" y="-10" width="260" height="8" rx="4"/>
        <rect x="-440" y="20" width="340" height="8" rx="4"/>
        <rect x="-440" y="50" width="290" height="8" rx="4"/>
        <rect x="100" y="-130" width="340" height="8" rx="4"/>
        <rect x="100" y="-100" width="290" height="8" rx="4"/>
        <rect x="100" y="-70" width="360" height="8" rx="4"/>
        <rect x="100" y="-40" width="310" height="8" rx="4"/>
        <rect x="100" y="-10" width="280" height="8" rx="4"/>
        <rect x="100" y="20" width="350" height="8" rx="4"/>
        <rect x="100" y="50" width="300" height="8" rx="4"/>
      </g>

      <!-- Rayons de lumière sortant du livre -->
      <g opacity="0.25" fill="#FFD234">
        <polygon points="0,-180 -120,-600 120,-600"/>
        <polygon points="-200,-150 -500,-500 -300,-520"/>
        <polygon points="200,-150 500,-500 300,-520"/>
        <polygon points="-350,-80 -700,-350 -550,-380"/>
        <polygon points="350,-80 700,-350 550,-380"/>
      </g>
    </g>

    <!-- ══════ Étoiles dorées flottant hors du livre ══════ -->
    <g fill="#FFD234" stroke="#C4850A" stroke-width="3">
      <polygon points="900,900 920,850 940,900 920,950" transform="rotate(15, 900, 900) scale(1.5)"/>
      <polygon points="2100,850 2120,800 2140,850 2120,900" transform="rotate(-10, 2100, 850) scale(1.3)"/>
      <polygon points="700,1100 718,1060 736,1100 718,1140" transform="rotate(5, 700, 1100)"/>
      <polygon points="2350,1050 2368,1010 2386,1050 2368,1090" transform="rotate(-8, 2350, 1050)"/>
    </g>

    <!-- Étoiles 5 branches -->
    <g fill="#FFD234" stroke="#C4850A" stroke-width="4">
      <polygon points="1200,650 1215,700 1265,700 1225,728 1240,778 1200,750 1160,778 1175,728 1135,700 1185,700"/>
      <polygon points="1800,700 1812,740 1855,740 1820,763 1833,805 1800,782 1767,805 1780,763 1745,740 1788,740" transform="scale(0.85) translate(300,50)"/>
      <polygon points="600,750 612,790 655,790 620,813 633,855 600,832 567,855 580,813 545,790 588,790" transform="scale(0.7) translate(200,200)"/>
    </g>

    <!-- ══════ PAPY BABOU (centre, au-dessus du livre) ══════ -->
    <g transform="translate(1500, 1250)">
      <!-- Corps petit chibi -->
      <ellipse cx="0" cy="180" rx="100" ry="90" fill="#D2B48C" stroke="#2D2D2D" stroke-width="8"/>
      <!-- Gilet -->
      <rect x="-35" y="95" width="70" height="35" rx="6" fill="#F0E0C0" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="0" cy="155" r="5" fill="#2D2D2D"/>
      <circle cx="0" cy="180" r="5" fill="#2D2D2D"/>

      <!-- GROSSE TETE CHIBI -->
      <circle cx="0" cy="-15" r="120" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="8"/>

      <!-- Cheveux blancs -->
      <ellipse cx="-95" cy="-50" rx="42" ry="50" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="95" cy="-50" rx="42" ry="50" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M-55,-130 Q0,-155 55,-130" fill="#E8E8E8" stroke="#2D2D2D" stroke-width="6"/>

      <!-- Oreilles -->
      <ellipse cx="-115" cy="-5" rx="16" ry="22" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="115" cy="-5" rx="16" ry="22" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- GRANDS YEUX -->
      <ellipse cx="-38" cy="-18" rx="28" ry="30" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="38" cy="-18" rx="28" ry="30" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-33" cy="-16" r="16" fill="#5A7A9A"/>
      <circle cx="43" cy="-16" r="16" fill="#5A7A9A"/>
      <circle cx="-31" cy="-18" r="9" fill="#2D2D2D"/>
      <circle cx="45" cy="-18" r="9" fill="#2D2D2D"/>
      <circle cx="-38" cy="-26" r="6" fill="#FFFFFF"/>
      <circle cx="38" cy="-26" r="6" fill="#FFFFFF"/>

      <!-- Sourcils bienveillants -->
      <path d="M-60,-52 Q-38,-64 -15,-54" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>
      <path d="M15,-54 Q38,-64 60,-52" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>

      <!-- LUNETTES DOREES -->
      <circle cx="-38" cy="-18" r="32" fill="none" stroke="#E8C44A" stroke-width="9"/>
      <circle cx="38" cy="-18" r="32" fill="none" stroke="#E8C44A" stroke-width="9"/>
      <line x1="-5" y1="-20" x2="5" y2="-20" stroke="#E8C44A" stroke-width="7"/>
      <line x1="-70" y1="-23" x2="-88" y2="-32" stroke="#E8C44A" stroke-width="6" stroke-linecap="round"/>
      <line x1="70" y1="-23" x2="88" y2="-32" stroke="#E8C44A" stroke-width="6" stroke-linecap="round"/>

      <!-- Nez rond -->
      <ellipse cx="0" cy="8" rx="12" ry="9" fill="#E8B88A" stroke="#2D2D2D" stroke-width="4"/>

      <!-- Moustache -->
      <path d="M-35,22 Q-18,34 0,27 Q18,34 35,22" fill="#C0C0C0" stroke="#2D2D2D" stroke-width="5"/>

      <!-- Grand sourire émerveillé -->
      <path d="M-30,38 Q0,62 30,38" fill="none" stroke="#2D2D2D" stroke-width="7" stroke-linecap="round"/>

      <!-- Joues roses -->
      <circle cx="-68" cy="12" r="18" fill="#F26B5E" opacity="0.3"/>
      <circle cx="68" cy="12" r="18" fill="#F26B5E" opacity="0.3"/>

      <!-- Bras tendus sur le livre -->
      <path d="M-100,140 Q-170,170 -220,190" fill="none" stroke="#D2B48C" stroke-width="40" stroke-linecap="round"/>
      <circle cx="-220" cy="190" r="20" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
      <path d="M100,140 Q170,170 220,190" fill="none" stroke="#D2B48C" stroke-width="40" stroke-linecap="round"/>
      <circle cx="220" cy="190" r="20" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>

      <!-- Jambes -->
      <rect x="-55" y="255" width="45" height="60" rx="18" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="6"/>
      <rect x="10" y="255" width="45" height="60" rx="18" fill="#2D5B9E" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="-33" cy="322" rx="30" ry="15" fill="#8B6914" stroke="#2D2D2D" stroke-width="5"/>
      <ellipse cx="33" cy="322" rx="30" ry="15" fill="#8B6914" stroke="#2D2D2D" stroke-width="5"/>
    </g>

    <!-- ══════ ANTOINE (gauche, émerveillé) ══════ -->
    <g transform="translate(650, 1500) scale(0.8)">
      <ellipse cx="0" cy="140" rx="75" ry="70" fill="#4A9FE5" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-10" r="100" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-85,-35 Q-90,-95 -55,-108 Q-25,-125 0,-118 Q25,-125 55,-108 Q90,-93 85,-35" fill="#8B6914" stroke="#2D2D2D" stroke-width="6"/>
      <path d="M5,-118 Q10,-150 20,-145 Q15,-132 12,-118" fill="#8B6914" stroke="#2D2D2D" stroke-width="4"/>
      <ellipse cx="-28" cy="-8" rx="24" ry="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="28" cy="-8" rx="24" ry="26" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-23" cy="-6" r="14" fill="#2D5B9E"/>
      <circle cx="33" cy="-6" r="14" fill="#2D5B9E"/>
      <circle cx="-21" cy="-8" r="8" fill="#2D2D2D"/>
      <circle cx="35" cy="-8" r="8" fill="#2D2D2D"/>
      <circle cx="-28" cy="-16" r="5.5" fill="#FFFFFF"/>
      <circle cx="28" cy="-16" r="5.5" fill="#FFFFFF"/>
      <!-- Bouche wow -->
      <ellipse cx="2" cy="32" rx="18" ry="13" fill="#2D2D2D"/>
      <!-- Joues -->
      <circle cx="-55" cy="18" r="15" fill="#F26B5E" opacity="0.35"/>
      <circle cx="55" cy="18" r="15" fill="#F26B5E" opacity="0.35"/>
      <!-- Bras tendu vers le haut -->
      <path d="M65,110 Q120,60 140,20" fill="none" stroke="#4A9FE5" stroke-width="32" stroke-linecap="round"/>
      <circle cx="140" cy="20" r="16" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="5"/>
    </g>

    <!-- ══════ NOEMIE (droite, sautillante) ══════ -->
    <g transform="translate(2350, 1520) scale(0.8)">
      <ellipse cx="0" cy="125" rx="70" ry="65" fill="#E895A8" stroke="#2D2D2D" stroke-width="7"/>
      <circle cx="0" cy="-15" r="90" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="7"/>
      <path d="M-78,-30 Q-82,-88 -50,-100 Q-22,-115 0,-108 Q22,-115 50,-100 Q82,-86 78,-30" fill="#FFD234" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-78" cy="-50" r="18" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <circle cx="78" cy="-50" r="18" fill="#FFD234" stroke="#2D2D2D" stroke-width="5"/>
      <!-- Noeud -->
      <path d="M10,-105 Q20,-122 30,-105" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <path d="M10,-105 Q20,-88 30,-105" fill="#F26B5E" stroke="#2D2D2D" stroke-width="4"/>
      <circle cx="20" cy="-105" r="5" fill="#D4486B" stroke="#2D2D2D" stroke-width="3"/>
      <ellipse cx="-25" cy="-10" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <ellipse cx="25" cy="-10" rx="22" ry="24" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="6"/>
      <circle cx="-29" cy="-8" r="13" fill="#4A9FE5"/>
      <circle cx="21" cy="-8" r="13" fill="#4A9FE5"/>
      <circle cx="-30" cy="-10" r="7" fill="#2D2D2D"/>
      <circle cx="20" cy="-10" r="7" fill="#2D2D2D"/>
      <circle cx="-25" cy="-18" r="5" fill="#FFFFFF"/>
      <circle cx="25" cy="-18" r="5" fill="#FFFFFF"/>
      <!-- Sourire chipie -->
      <path d="M-22,26 Q0,44 22,26" fill="none" stroke="#2D2D2D" stroke-width="6" stroke-linecap="round"/>
      <!-- Joues -->
      <circle cx="-50" cy="16" r="14" fill="#F26B5E" opacity="0.4"/>
      <circle cx="50" cy="16" r="14" fill="#F26B5E" opacity="0.4"/>
      <!-- Bras levé -->
      <path d="M-60,95 Q-100,60 -110,25" fill="none" stroke="#E895A8" stroke-width="28" stroke-linecap="round"/>
      <circle cx="-110" cy="25" r="14" fill="#F5D0A9" stroke="#2D2D2D" stroke-width="4"/>
    </g>

    <!-- ══════ TEXTE ══════ -->
    <text x="1500" y="480"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="140"
          font-weight="700"
          fill="#FFFFFF"
          stroke="#1B2A4A"
          stroke-width="8"
          paint-order="stroke"
          letter-spacing="5"
          opacity="0.95">Les Histoires de</text>

    <text x="1500" y="720"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="380"
          font-weight="800"
          fill="#FFD234"
          stroke="#1B2A4A"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(-2, 1500, 720)">Papy</text>

    <text x="1500" y="1070"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="380"
          font-weight="800"
          fill="#F26B5E"
          stroke="#1B2A4A"
          stroke-width="14"
          paint-order="stroke"
          letter-spacing="10"
          transform="rotate(2, 1500, 1070)">Babou</text>

    <!-- Sous-titre -->
    <text x="1500" y="2750"
          text-anchor="middle"
          font-family="'Baloo 2', 'Comic Sans MS', sans-serif"
          font-size="75"
          font-weight="600"
          fill="#FFD234"
          stroke="#1B2A4A"
          stroke-width="5"
          paint-order="stroke"
          letter-spacing="6">Les épopées bibliques en famille</text>

    <!-- ══════ BORDURE ══════ -->
    <rect x="40" y="40" width="2920" height="2920" rx="130" ry="130"
          fill="none" stroke="#FFD234" stroke-width="10" opacity="0.5"/>

  </g>
</svg>
